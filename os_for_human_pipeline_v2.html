<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS_FOR_HUMAN Pipeline v2</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #111111;
  --bg-tertiary: #1a1a1a;
  --bg-input: #0d0d0d;
  --border: #222;
  --border-active: #444;
  --text-primary: #e0e0e0;
  --text-secondary: #888;
  --text-muted: #555;
  --accent-claude: #d4a27a;
  --accent-gpt: #74aa9c;
  --accent-grok: #e44d4d;
  --accent-gemini: #8b9cf7;
  --accent-orch: #e0c060;
  --status-ok: #4a7;
  --status-err: #c44;
  --status-warn: #ca4;
  --status-active: #6af;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Noto Sans JP', 'JetBrains Mono', monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── HEADER ─── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.logo {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 2px;
}
.logo span { color: var(--accent-orch); font-size: 11px; margin-left: 8px; font-weight: 400; }

.header-right { display: flex; gap: 8px; align-items: center; }

.btn-header {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 4px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-header:hover { border-color: var(--border-active); color: var(--text-primary); }
.dev-only { display: none; }
body.dev-mode .dev-only { display: inline-block; }
.dev-toggle { opacity: 0.3; font-size: 9px; padding: 2px 6px; }
body.dev-mode .dev-toggle { opacity: 1; border-color: var(--accent); }
.onboard-guide { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin: 20px auto; max-width: 600px; }
.onboard-guide h3 { margin: 0 0 12px; color: var(--text-primary); font-size: 16px; }
.onboard-guide p { color: var(--text-secondary); font-size: 14px; margin: 8px 0; }
.key-btn { display: inline-block; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin: 4px; text-decoration: none; transition: all 0.15s; }
.key-btn:hover { border-color: var(--accent); background: var(--bg-hover); }

.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-muted); transition: background 0.3s;
}
.status-dot.ok { background: var(--status-ok); }

/* ─── MAIN LAYOUT ─── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ─── CHAT AREA ─── */
.chat-area { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); }

/* ─── STRUCTURED LOG PANEL ─── */
.log-panel {
  width: 320px;
  border-left: 1px solid var(--border);
  background: var(--bg-secondary);
  display: none;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
}
.log-panel.open { display: flex; }
.log-panel-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 1px;
.copy-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 2px 6px;
  font-size: 12px;
  cursor: pointer;
  border-radius: 3px;
  margin-left: 8px;
  transition: all 0.15s;
}
.copy-btn:hover {
  border-color: var(--border-active);
  color: var(--text-primary);
}
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.log-entry-card {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  line-height: 1.5;
  color: var(--text-secondary);
}
.log-entry-card .field-label { color: var(--accent-orch); font-weight: 500; }
.log-entry-card .field-value { color: var(--text-primary); margin-left: 4px; }

/* ─── INPUT BAR ─── */
.input-bar {
  border-top: 1px solid var(--border);
  background: var(--bg-secondary);
  padding: 10px 16px;
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
}
.input-bar textarea {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 8px 12px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  border-radius: 6px;
  resize: none;
  min-height: 40px;
  max-height: 120px;
  outline: none;
}
.input-bar textarea:focus { border-color: var(--border-active); }
.input-bar select {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 6px 8px;
  font-size: 11px;
  border-radius: 4px;
  outline: none;
}
.input-bar button {
  background: var(--accent-orch);
  border: none;
  color: #000;
  padding: 8px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
}
.input-bar button:hover { opacity: 0.85; }

/* ─── CHAT BUBBLES ─── */
.chat-user { background: #1a1a2e; border-left: 3px solid #4fc3f7; padding: 14px 18px; margin: 10px auto; border-radius: 8px; max-width: 650px; }
.chat-ai { background: #1a1a2e; border-left: 3px solid #50fa7b; padding: 14px 18px; margin: 10px auto; border-radius: 8px; position: relative; max-width: 650px; }
.chat-system { background: #1a1a2e; border-left: 3px solid #555; padding: 10px 14px; margin: 6px auto; border-radius: 6px; max-width: 650px; font-size: 13px; }
.chat-error { background: #1a1a2e; border-left: 3px solid #ff5555; padding: 10px 14px; margin: 6px auto; border-radius: 6px; max-width: 650px; }
.chat-diagnosis { background: #0a1628; border-left: 3px solid var(--accent-orch); padding: 12px 16px; margin: 8px auto; border-radius: 8px; max-width: 650px; }
.bubble-label { font-size: 12px; color: #666; margin-bottom: 4px; }
.bubble-body { color: #d4d4d4; font-size: 15px; line-height: 1.7; font-family: -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif; }
.bubble-body p { margin: 10px 0; }
.bubble-body p:first-child { margin-top: 0; }
.bubble-body p:last-child { margin-bottom: 0; }

/* ─── DIAGNOSIS CARD ─── */
.diagnosis-card {
  background: #0d1117;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  margin: 8px 0;
  font-size: 12px;
}
.diagnosis-card h4 { color: var(--accent-orch); margin-bottom: 8px; font-size: 13px; }
.diagnosis-row { display: flex; gap: 8px; margin: 4px 0; }
.diagnosis-label { color: var(--text-secondary); min-width: 80px; flex-shrink: 0; }
.diagnosis-value { color: var(--text-primary); }
.task-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}
.task-badge.diagnose { background: #1a3a2a; color: #50fa7b; }
.task-badge.code-fix { background: #3a1a1a; color: #ff6b6b; }

/* ─── PIPELINE MONITOR ─── */
#pipelineMonitor {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 380px;
  max-height: 480px;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 12px;
  z-index: 9999;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  display: none;
  flex-direction: column;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  overflow: hidden;
}
#pipelineMonitor.active { display: flex; }
#pipelineMonitor .pm-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  cursor: pointer;
  user-select: none;
}
#pipelineMonitor .pm-header .pm-title {
  color: #e0c060;
  font-weight: 700;
  font-size: 13px;
}
#pipelineMonitor .pm-header .pm-elapsed {
  color: #888;
  font-size: 11px;
}
#pipelineMonitor .pm-body {
  padding: 8px 0;
  overflow-y: auto;
  max-height: 400px;
}
.pm-step {
  display: flex;
  align-items: flex-start;
  padding: 6px 14px;
  gap: 10px;
  position: relative;
}
.pm-step::before {
  content: '';
  position: absolute;
  left: 24px;
  top: 24px;
  bottom: -6px;
  width: 1px;
  background: #30363d;
}
.pm-step:last-child::before { display: none; }
.pm-step-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  flex-shrink: 0;
  z-index: 1;
}
.pm-step.pending .pm-step-icon { background: #21262d; color: #484f58; }
.pm-step.active .pm-step-icon { background: #1f3a5f; color: #58a6ff; animation: pm-pulse 1.2s infinite; }
.pm-step.done .pm-step-icon { background: #1a3a2a; color: #50fa7b; }
.pm-step.fail .pm-step-icon { background: #3a1a1a; color: #ff6b6b; }
.pm-step.skip .pm-step-icon { background: #21262d; color: #636c76; }
@keyframes pm-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(88,166,255,0.4); }
  50% { box-shadow: 0 0 0 6px rgba(88,166,255,0); }
}
.pm-step-content { flex: 1; min-width: 0; }
.pm-step-label {
  color: #c9d1d9;
  font-size: 12px;
  font-weight: 500;
  line-height: 22px;
}
.pm-step.pending .pm-step-label { color: #484f58; }
.pm-step.skip .pm-step-label { color: #636c76; text-decoration: line-through; }
.pm-step-detail {
  color: #8b949e;
  font-size: 11px;
  margin-top: 2px;
  word-break: break-all;
}
.pm-step.fail .pm-step-detail { color: #ff6b6b; }
.pm-step.done .pm-step-detail { color: #50fa7b; }
.pm-minimize-btn {
  background: none;
  border: none;
  color: #8b949e;
  cursor: pointer;
  font-size: 14px;
  padding: 0 4px;
}
.pm-minimize-btn:hover { color: #c9d1d9; }

/* ─── TOAST ─── */
#toastMsg {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 12px;
  display: none;
  z-index: 10000;
}

/* ─── SERVER RECOVERY BUTTON ─── */
#serverRecoveryBar {
  display: none;
  padding: 10px 16px;
  background: #1a0a0a;
  border-bottom: 1px solid #c44;
  text-align: center;
  font-size: 12px;
  color: #ff6b6b;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
#serverRecoveryBar.visible { display: flex; }
#btnRecoverServer {
  background: #c44;
  color: #fff;
  border: none;
  padding: 6px 16px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  animation: blink-red 1s infinite;
}
#btnRecoverServer:hover { opacity: 0.85; }
#btnRecoverServer:disabled { animation: none; opacity: 0.5; cursor: default; }
@keyframes blink-red {
  0%, 100% { background: #c44; }
  50% { background: #ff6b6b; box-shadow: 0 0 8px #ff6b6b; }
}
#recoveryStatus { color: #888; font-size: 11px; }

/* ─── API ALERT ─── */
#apiAlert {
  display: none;
  padding: 8px 16px;
  font-size: 12px;
  text-align: center;
}

/* ─── ATTACHMENTS ─── */
#chatAttachments {
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  padding: 4px 16px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>

<!-- ─── HEADER ─── -->
<div class="header">
  <div class="logo">OS_FOR_HUMAN <span>v2 — AI会議室</span></div>
  <div class="header-right">
    <button class="btn-header dev-only" onclick="toggleLogPanel()">📊 診断ログ</button>
    <button class="btn-header dev-only" onclick="clearChat()">🗑 クリア</button>
    <button class="btn-header dev-only" id="restartAllButton" onclick="restartAll()">全再起動</button>
    <button class="btn-header dev-only" onclick="exportDiagnosisLogs()">📥 ログ出力</button>
    <span class="btn-header" id="usageDisplay" style="cursor:default;color:var(--text-muted);font-size:10px;" title="今月の推定API利用額">~0円</span>
    <button class="btn-header" onclick="window.open('/api_vault.html','_blank')">⚙ AI設定</button>
    <button class="btn-header dev-toggle" onclick="toggleDevMode()" title="開発モード切替">🔧</button>
    <span class="btn-header dev-only" id="queueCount" style="cursor:default;color:var(--text-muted);">Q:0</span>
    <div class="status-dot dev-only" id="statusDot" title="server.py"></div>
    <span class="dev-only" id="daemon-status" style="display: inline-block; width: 10px; height: 10px; background-color: red; border-radius: 50%; margin-left: 5px;"></span>
  </div>
</div>

<!-- ─── RECOVERY BAR ─── -->
<div id="serverRecoveryBar">
  <span id="recoveryLabel">server.py 未起動</span>
  <button id="btnRecoverServer" onclick="recoverAll()">起動する</button>
  <span id="recoveryStatus"></span>
</div>

<!-- ─── API ALERT ─── -->
<div id="apiAlert"></div>

<!-- ─── MAIN ─── -->
<div class="main" style="flex-direction: row;">

  <!-- CHAT AREA -->
  <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
    <div class="chat-area" id="chatMessages">
      <p style="color:#555; text-align:center; margin-top:40px;">OS_FOR_HUMAN v2 — chat診断モード</p>
    </div>

    <!-- ATTACHMENTS -->
    <div id="chatAttachments"></div>

    <!-- INPUT BAR -->
    <div class="input-bar">
      <select id="chatProvider">
        <option value="auto">AUTO</option>
        <option value="claude">Claude</option>
        <option value="gpt">GPT</option>
        <option value="gemini">Gemini</option>
        <option value="grok">Grok</option>
      </select>
      <textarea id="chatInput" placeholder="質問・相談・修正依頼を入力..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage();}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';"
      ></textarea>
      <button onclick="sendChatMessage()">送信</button>
    </div>
  </div>

  <!-- STRUCTURED LOG PANEL (右サイド) -->
  <div class="log-panel" id="logPanel">
    <div class="log-panel-header">
      <span>構造化診断ログ</span>
      <span id="logCount" style="color:var(--accent-orch);">0件</span>
    </div>
    <div id="logEntries" style="flex:1; overflow-y:auto;"></div>
  </div>
</div>

<!-- PIPELINE MONITOR -->
<div id="pipelineMonitor">
  <div class="pm-header" onclick="pipelineMonitor.toggle()">
    <span class="pm-title">Pipeline Monitor</span>
    <span class="pm-elapsed" id="pmElapsed"></span>
    <button class="pm-minimize-btn" id="pmMinBtn">_</button>
  </div>
  <div class="pm-body" id="pmBody"></div>
</div>

<!-- TOAST -->
<div id="toastMsg"></div>

<script>
// ═══════════════════════════════════════════════════════
// OS_FOR_HUMAN Pipeline v2 — 最小骨格
// ─── 三層構造: chat診断 / 構造化ログ / 修正依頼 ───
// ═══════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════
// PIPELINE MONITOR — リアルタイム処理フロー可視化
// ═══════════════════════════════════════════════════════
const pipelineMonitor = (() => {
  const STEPS = [
    { id: 'input',     icon: '1', label: '入力受付' },
    { id: 'search',    icon: '2', label: '過去ログ検索 (3層)' },
    { id: 'facts',     icon: '3', label: '事実収集' },
    { id: 'ai_call',   icon: '4', label: 'AI呼び出し' },
    { id: 'diagnosis', icon: '5', label: 'diagnosis抽出' },
    { id: 'audit',     icon: '6', label: '回答監査' },
    { id: 'verify',    icon: '7', label: '検証AI' },
    { id: 'precheck',  icon: '8', label: '実装済みチェック' },
    { id: 'codefix',   icon: '9', label: 'code_fix / orchestrate' },
  ];
  let _startTime = 0;
  let _timerInterval = null;
  let _minimized = false;
  let _stepStates = {};

  function show() {
    const el = document.getElementById('pipelineMonitor');
    el.classList.add('active');
    _startTime = Date.now();
    _stepStates = {};
    _minimized = false;
    document.getElementById('pmMinBtn').textContent = '_';
    // ステップ初期化
    const body = document.getElementById('pmBody');
    body.style.display = '';
    body.innerHTML = STEPS.map(s =>
      `<div class="pm-step pending" id="pm-${s.id}">` +
        `<div class="pm-step-icon">${s.icon}</div>` +
        `<div class="pm-step-content">` +
          `<div class="pm-step-label">${s.label}</div>` +
          `<div class="pm-step-detail" id="pm-${s.id}-detail"></div>` +
        `</div>` +
      `</div>`
    ).join('');
    // 経過時間タイマー
    clearInterval(_timerInterval);
    _timerInterval = setInterval(() => {
      const sec = ((Date.now() - _startTime) / 1000).toFixed(1);
      document.getElementById('pmElapsed').textContent = sec + 's';
    }, 200);
  }

  function hide() {
    document.getElementById('pipelineMonitor').classList.remove('active');
    clearInterval(_timerInterval);
  }

  function toggle() {
    _minimized = !_minimized;
    document.getElementById('pmBody').style.display = _minimized ? 'none' : '';
    document.getElementById('pmMinBtn').textContent = _minimized ? '□' : '_';
  }

  // status: 'active' | 'done' | 'fail' | 'skip'
  function step(id, status, detail) {
    _stepStates[id] = status;
    const el = document.getElementById(`pm-${id}`);
    if (!el) return;
    el.className = `pm-step ${status}`;
    const iconMap = { active: '⟳', done: '✓', fail: '✗', skip: '—' };
    const iconEl = el.querySelector('.pm-step-icon');
    if (status !== 'pending') iconEl.textContent = iconMap[status] || iconEl.textContent;
    if (detail !== undefined) {
      document.getElementById(`pm-${id}-detail`).textContent = detail;
    }
  }

  // 全完了時
  function finish(success) {
    clearInterval(_timerInterval);
    const sec = ((Date.now() - _startTime) / 1000).toFixed(1);
    const hdr = document.querySelector('#pipelineMonitor .pm-title');
    if (success) {
      hdr.textContent = `Pipeline完了 (${sec}s)`;
      hdr.style.color = '#50fa7b';
    } else {
      hdr.textContent = `Pipeline失敗 (${sec}s)`;
      hdr.style.color = '#ff6b6b';
    }
    // 3秒後にタイトル色リセット
    setTimeout(() => {
      hdr.style.color = '#e0c060';
      hdr.textContent = 'Pipeline Monitor';
    }, 8000);
  }

  return { show, hide, toggle, step, finish, STEPS };
})();

// ─── API CONFIG（v0.6から流用） ───
const MODELS = {
  claude: { model: 'claude-sonnet-4-20250514', key: 'anthropic' },
  gpt:    { model: 'gpt-4o', key: 'openai' },
  grok:   { model: 'grok-3-latest', key: 'xai' },
  gemini: { model: 'gemini-2.5-flash', key: 'gemini' },
};

const FALLBACK_MODELS = {
  gemini: ['gemini-2.5-flash'],
  gpt:    ['gpt-4o', 'gpt-4o-mini'],
  claude: ['claude-sonnet-4-20250514', 'claude-3-5-sonnet-20241022'],
  grok:   ['grok-3-latest', 'grok-2-latest'],
};

const SELF_CONTEXT = [
  '【このシステムについて】',
  'あなたが動作しているシステムは「OS_FOR_HUMAN AI会議室 v2」（os_for_human_pipeline_v2.html）です。',
  '',
  '■ 三層構造:',
  '  1. chat診断（主系）— あなたはここで動いている',
  '  2. 構造化ログ記録 — あなたの回答から自動抽出してlocalStorageに保存',
  '  3. 修正依頼 — code_fixのときだけserver.py経由でClaude Codeに送信',

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 簡易Markdown→HTML変換（AI応答用）
function mdToHtml(s) {
  let h = escHtml(s);
  // コードブロック ```...```
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre style="background:#0d1117;padding:10px 12px;border-radius:6px;overflow-x:auto;margin:8px 0;font-size:13px;font-family:monospace;line-height:1.4;white-space:pre-wrap;"><code>$2</code></pre>');
  // インラインコード `...`
  h = h.replace(/`([^`]+)`/g, '<code style="background:#0d1117;padding:2px 5px;border-radius:3px;font-size:13px;font-family:monospace;">$1</code>');
  // 見出し ###
  h = h.replace(/^### (.+)$/gm, '<div style="font-weight:700;font-size:15px;color:#e0e0e0;margin:12px 0 4px;">$1</div>');
  h = h.replace(/^## (.+)$/gm, '<div style="font-weight:700;font-size:16px;color:#e0e0e0;margin:14px 0 6px;">$1</div>');
  // 太字 **...**
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // リスト項目 - ...（行頭）
  h = h.replace(/^- (.+)$/gm, '<div style="padding-left:16px;margin:2px 0;">• $1</div>');
  // 番号付きリスト
  h = h.replace(/^(\d+)\. (.+)$/gm, '<div style="padding-left:16px;margin:2px 0;">$1. $2</div>');
  // リスト項目間の余分な空行を除去（divの後の\n\nを\nに）
  h = h.replace(/<\/div>\n\n/g, '</div>\n');
  // 段落分け（連続空行→段落間マージン）
  h = h.replace(/\n{3,}/g, '\n\n');
  h = h.replace(/\n\n/g, '</p><p style="margin:10px 0;">');
  h = h.replace(/\n/g, '');
  h = '<p style="margin:0;">' + h + '</p>';
  // 空のpタグを除去
  h = h.replace(/<p style="margin:\d+px 0;"><\/p>/g, '');
  return h;
}

// toast notification
function showToast(msg, duration = 2000) {
  const el = document.getElementById('toastMsg');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => {
    el.style.transition = 'opacity 0.5s';
    el.style.opacity = '0';
    setTimeout(() => { el.style.display = 'none'; el.style.transition = ''; }, 500);
  }, duration);
}

function fetchWithTimeout(url, options = {}, timeoutMs = 10000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  return fetch(url, { ...options, signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

function getApiKeys() {
  try {
    const raw = JSON.parse(localStorage.getItem('apiKeys') || '{}');
    return {
      claude: raw.claude || raw.anthropic,
      gpt:    raw.gpt    || raw.openai,
      grok:   raw.grok   || raw.xai,
      gemini: raw.gemini
    };
  } catch(e) { return {}; }
}

function showApiAlert(provider, statusCode) {
  const el = document.getElementById('apiAlert');
  if (!el) return;
  const billingUrl = BILLING_URLS[provider] || '#';
  const link = billingUrl !== '#'
    ? ` <a href="${billingUrl}" target="_blank" style="color:inherit;text-decoration:underline;">課金ページ</a>` : '';
  let bg, text;
  if (statusCode === 400) { bg = '#6b0000'; text = `🔴 ${provider} 課金切れまたはリクエスト不正。他のAIに自動切替します。${link}`; }
  else if (statusCode === 429) { bg = '#7a6000'; text = `⚠️ ${provider} のAPI利用制限に達しました。他のAIに自動切替します。${link}`; }
  else if (statusCode === 402 || statusCode === 403) { bg = '#6b0000'; text = `🔴 ${provider} のAPIキーが無効または課金切れです。${link}`; }
  else if (statusCode >= 500) { bg = '#003a5c'; text = `🔧 ${provider} のサーバー障害。他のAIで自動代替します。`; }
  else { bg = '#333'; text = `⚠️ ${provider} エラー (${statusCode})`; }
  el.style.background = bg; el.style.color = '#fff'; el.style.display = 'block'; el.style.opacity = '1';
  el.innerHTML = text;
  clearTimeout(el._alertTimer);
  el._alertTimer = setTimeout(() => { el.style.opacity = '0.5'; }, 10000);
}

const _usageCosts = { gpt: 3, claude: 4, grok: 2, gemini: 1 }; // 1回あたり概算円
function trackUsage(provider) {
  const key = 'os4h_usage_' + new Date().toISOString().slice(0, 7); // 月単位
  const usage = JSON.parse(localStorage.getItem(key) || '{"calls":0,"cost":0,"detail":{}}');
  usage.calls++;
  usage.cost += (_usageCosts[provider] || 2);
  usage.detail[provider] = (usage.detail[provider] || 0) + 1;
  localStorage.setItem(key, JSON.stringify(usage));
  updateUsageDisplay();
}
function updateUsageDisplay() {
  const el = document.getElementById('usageDisplay');
  if (!el) return;
  const key = 'os4h_usage_' + new Date().toISOString().slice(0, 7);
  const usage = JSON.parse(localStorage.getItem(key) || '{"calls":0,"cost":0}');
  el.textContent = `~${usage.cost}円`;
  el.title = `今月の推定API利用額: 約${usage.cost}円 (${usage.calls}回)`;
}

async function callAI(provider, systemPrompt, userMsg, images = [], options = {}) {
  if (!userMsg && (!images || images.length === 0)) {
    throw new Error(`${provider}: 空メッセージは送信できません`);
  }
  if (!userMsg) userMsg = '（添付画像を確認してください）';

  const cfg = MODELS[provider];
  const keys = getApiKeys();
  const key = keys[provider];
  if (!key) throw new Error(`${provider} のAPIキーが未設定です。AI設定で設定してください。`);

  const timeout = options.timeout || 30000;
  let signal = options.signal || undefined;
  let _ownAbort = null;
  if (!signal) {
    _ownAbort = new AbortController();
    signal = _ownAbort.signal;
    setTimeout(() => _ownAbort.abort(), timeout);
  }

  const _handleErr = async (r) => {
    showApiAlert(provider, r.status);
    const t = await r.text();
    if (r.status === 404) {
      const fallbacks = FALLBACK_MODELS[provider] || [];
      for (const fb of fallbacks) {
        if (fb === cfg.model) continue;
        MODELS[provider].model = fb;
        showToast(`${provider.toUpperCase()}: モデルを ${fb} に自動更新`, 5000);
        break;
      }
    }
    if (r.status === 429) {
      showToast(`⚠️ ${provider.toUpperCase()}: 課金切れまたはレート制限中`, 8000);
    }
    if (r.status >= 400) {
      if (!skipProviders.includes(provider)) skipProviders.push(provider);
    }
    throw new Error(`${provider} error ${r.status}: ${t.slice(0, 200)}`);
  };

  let res, data;

  if (provider === 'claude') {
    const userContent = [];
    if (images && images.length > 0) {
      images.forEach(img => {
        const m = img.match(/^data:([^;]+);base64,(.+)$/);
        if (m) userContent.push({ type: 'image', source: { type: 'base64', media_type: m[1], data: m[2] } });
      });
    }
    userContent.push({ type: 'text', text: userMsg });
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: cfg.model, max_tokens: 8192, system: systemPrompt, messages: [{ role: 'user', content: userContent }] }),
      signal
    });
    if (!res.ok) await _handleErr(res);
    data = await res.json();
    trackUsage('claude');
    return data.content.map(c => c.text || '').join('');
  }

  if (provider === 'gpt') {
    const userContent = (images && images.length > 0)
      ? [...images.map(img => ({ type: 'image_url', image_url: { url: img.startsWith('data:') ? img : `data:image/png;base64,${img}` } })), { type: 'text', text: userMsg }]
      : userMsg;
    res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: cfg.model, max_tokens: 8192, messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userContent }] }),
      signal
    });
    if (!res.ok) await _handleErr(res);
    data = await res.json();
    trackUsage('gpt');
    return data.choices[0].message.content;
  }

  if (provider === 'grok') {
    const grokContent = (images && images.length > 0)
      ? [...images.map(img => ({ type: 'image_url', image_url: { url: img.startsWith('data:') ? img : `data:image/png;base64,${img}` } })), { type: 'text', text: userMsg }]
      : userMsg;
    res = await fetch('https://api.x.ai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: cfg.model, max_tokens: 8192, messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: grokContent }] }),
      signal
    });
    if (!res.ok) await _handleErr(res);
    data = await res.json();
    trackUsage('grok');
    return data.choices[0].message.content;
  }

  if (provider === 'gemini') {
    const parts = [];
    if (images && images.length > 0) {
      images.forEach(img => {
        const m = img.match(/^data:([^;]+);base64,(.+)$/);
        if (m) parts.push({ inline_data: { mime_type: m[1], data: m[2] } });
      });
    }
    parts.push({ text: userMsg });
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: 'user', parts }],
        generationConfig: { maxOutputTokens: 8192 }
      }),
      signal
    });
    if (!res.ok) await _handleErr(res);
    data = await res.json();
    trackUsage('gemini');
    return data.candidates[0].content.parts.map(p => p.text || '').join('');
  }

  throw new Error(`未対応プロバイダ: ${provider}`);
}

function pickProvider(prefs) {
  const available = prefs.filter(p => !skipProviders.includes(p));
  return available[0] || prefs[0];
}

function classifyQuery(q) {
  if (/コード|修正|バグ|エラー|実装|関数/.test(q)) return 'claude';
  if (/画像|写真|スクショ|場所|地図/.test(q)) return 'gemini';
  if (/最新|ニュース|速報|トレンド/.test(q)) return 'grok';
  return 'gpt';
}

// ─── diagnosisブロック抽出 ───
function extractDiagnosis(aiResponse) {
  const match = aiResponse.match(/```diagnosis\s*\n([\s\S]*?)\n```/);
  if (!match) return null;
  try {
    const parsed = JSON.parse(match[1]);
    // 必須フィールド検証
    const required = ['phenomenon', 'rootCause', 'targetFunc', 'forbiddenFixes', 'verifyMethod', 'taskType'];
    for (const f of required) {
      if (!(f in parsed)) return null;
    }
    // taskType正規化
    if (!['diagnose', 'code_fix', 'orchestrate', 'general'].includes(parsed.taskType)) {
      parsed.taskType = 'diagnose';
    }
    return parsed;
  } catch (e) {
    return null;
  }
}

// ─── AI応答からdiagnosisブロックを除去（表示用） ───
function stripDiagnosisBlock(text) {
  return text.replace(/```diagnosis\s*\n[\s\S]*?\n```/g, '').trim();
}

// ─── 事実収集: AI回答前にシステム状態・ファイル内容を自動取得 ───
async function gatherFacts(userInput) {
  let facts = '';
  const q = userInput.toLowerCase();

  try {
    // 1. daemon/server状態（常に取得）
    const daemonRes = await fetchWithTimeout('http://localhost:5000/api/daemon/status', {}, 2000);
    if (daemonRes.ok) {
      const d = await daemonRes.json();
      facts += `【事実: daemon状態】alive=${d.alive}, mode=${d.mode}\n`;
    }

    // 2. キュー件数（常に取得）
    const qRes = await fetchWithTimeout('http://localhost:5000/api/code/queue/count', {}, 2000);
    if (qRes.ok) {
      const qd = await qRes.json();
      facts += `【事実: キュー】未処理=${qd.count}件\n`;
    }

    // 3. エラー・ログ・起動・原因系の質問 → 直近のcode_resultsを取得
    if (/エラー|ログ|原因|失敗|起動|動かない|なんで|なぜ/.test(q)) {
      const files = ['code_results'];
      // 直近のresultファイルを探す
      try {
        const listRes = await fetchWithTimeout('http://localhost:5000/api/code/status', {}, 2000);
        if (listRes.ok) {
          const statusData = await listRes.json();
          facts += `【事実: code実行状態】${JSON.stringify(statusData).slice(0, 200)}\n`;
        }
      } catch(e) {}
    }

    // 4. 関数名・ファイル名が含まれてたら実コードを確認
    const funcMatch = q.match(/[a-zA-Z_]\w{5,}/g);
    if (funcMatch && funcMatch.length > 0) {
      const targetFile = resolveTargetFile(funcMatch[0]);
      try {
        const fileRes = await fetchWithTimeout('http://localhost:5000/api/file/read', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: targetFile })
        }, 3000);
        if (fileRes.ok) {
          const fileData = await fileRes.json();
          const content = fileData.content || '';
          // マッチした関数名の周辺コードを抽出
          for (const fn of funcMatch.slice(0, 3)) {
            const idx = content.indexOf(fn);
            if (idx >= 0) {
              const lineNum = content.slice(0, idx).split('\n').length;
              const lines = content.split('\n');
              const start = Math.max(0, lineNum - 3);
              const end = Math.min(lines.length, lineNum + 5);
              facts += `【事実: ${targetFile}内の${fn}】行${start+1}-${end}\n${lines.slice(start, end).join('\n')}\n\n`;
            }
          }
        }
      } catch(e) {}
    }

    // 5. 実装・追加・機能系の質問 → 対象ファイルの関数一覧を取得
    if (/実装|追加|機能|入って|ある？|済み/.test(q)) {
      try {
        const fileRes = await fetchWithTimeout('http://localhost:5000/api/file/read', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: 'os_for_human_pipeline_v2.html' })
        }, 3000);
        if (fileRes.ok) {
          const fileData = await fileRes.json();
          const content = fileData.content || '';
          // function宣言を抽出
          const funcs = [...content.matchAll(/(?:async )?function (\w+)/g)].map(m => m[1]);
          facts += `【事実: v2.html内の全関数(${funcs.length}個)】${funcs.join(', ')}\n`;
        }
      } catch(e) {}
    }
  } catch (e) {}

  return facts ? '\n' + facts + '\n' : '';
}

// ─── 実コード確認: code_fix前に対象ファイルを読んで既に実装済みか確認 ───
async function checkAlreadyImplemented(diagnosis) {
  if (!serverAlive) return null;
  const targetFile = resolveTargetFile(diagnosis.targetFunc || '');
  try {
    const res = await fetchWithTimeout('http://localhost:5000/api/file/read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: targetFile })
    }, 5000);
    if (!res.ok) return null;
    const data = await res.json();
    const content = data.content || '';

    // 修正対象の関数名・キーワードがファイル内に既に存在するか
    const target = diagnosis.targetFunc || '';
    const keywords = target.split(/[\s,/]+/).filter(w => w.length > 3);

    // phenomenonからもキーワード抽出
    const phenWords = (diagnosis.phenomenon || '').match(/[a-zA-Z_]\w{4,}/g) || [];
    const allKeywords = [...keywords, ...phenWords].slice(0, 5);

    // キーワードがコード内に見つかったら、その周辺を確認
    for (const kw of allKeywords) {
      if (content.includes(kw)) {
        // 見つかった → その関数/機能が既に存在する
        const idx = content.indexOf(kw);
        const snippet = content.slice(Math.max(0, idx - 100), idx + 200);
        // 簡易判定: 修正対象の関数が既に定義されてるなら「実装済み」
        if (snippet.includes('function ') || snippet.includes('async function ')) {
          return `${kw} は ${targetFile} 内に既に存在（行${content.slice(0, idx).split('\n').length}付近）`;
        }
      }
    }
    return null;
  } catch (e) {
    return null;
  }
}

        }

        // daemon処理を待つ（最大90秒 — orchestrateはステップが多いので余裕を持つ）
        let stepResult = null;

            if (rr.ok) {

          } catch (e) {}
        }

        removeLast('system');
        if (stepResult && stepResult.success) {
          appendChatBubble('system', `✅ Step ${step._sortedOrder}: ${step.description} — 完了`);
          successCount++;
          consecutiveFails = 0;
        } else {

          failedFiles.add(step.targetFile);
          const reason = stepResult?.audit?.reason || '不明';
          appendChatBubble('system', `❌ Step ${step._sortedOrder}: ${step.description} — 失敗 (${reason})`);
        }

        consecutiveFails++;

    if (failedSteps.size > 0) summary += ` / ${failedSteps.size}件失敗またはスキップ`;
    appendChatBubble('system', summary);

    removeLast('system');
    appendChatBubble('error', `オーケストレーター失敗: ${e.message}`);
  } finally {
    _orchestrate進行中 = false;
  }
}

// ─── 過去ログ再利用: 同じ修正があったら過去修正を参照して再依頼 ───
async function searchPastFix(diagnosis) {
  // code_resultsから成功した過去の修正を検索
  if (!serverAlive) return null;
  try {
    // 構造化診断ログから同じtargetFunc+phenomenonのcode_fixを探す
    const diagLogs = JSON.parse(localStorage.getItem('os4h_v2_diagnosis_logs') || '[]');
    const candidates = diagLogs.filter(log =>
      log.taskType === 'code_fix' &&
      log.targetFunc && diagnosis.targetFunc &&
      log.targetFunc === diagnosis.targetFunc &&
      log.phenomenon && diagnosis.phenomenon &&
      log.phenomenon.slice(0, 20) === diagnosis.phenomenon.slice(0, 20)
    );
    if (candidates.length === 0) return null;

    // 対応するcode_resultsがあるか確認（成功したもの）
    for (const c of candidates.reverse()) {
      try {
        const res = await fetchWithTimeout(`http://localhost:5000/api/code/result/${c.id}`, {}, 3000);
        if (!res.ok) continue;
        const result = await res.json();
        if (result.success && result.file_changed && result.audit && result.audit.passed) {
          return result; // 成功した過去の修正を返す
        }
      } catch (e) { continue; }
    }
    return null;
  } catch (e) {
    return null;
  }
}

async function applyPastFix(pastResult, logEntry) {
  // 過去の成功した修正のoutputから編集内容を再適用
  // pastResult.outputには "適用: X/X件成功" のような文字列が入ってる
  // 直接再適用は難しいので、同じinstructionでdaemonに投げるが「過去に成功した」フラグ付き
  if (!serverAlive) return false;
  try {
    const instruction = [
      '【過去の成功した修正の再適用】',
      `過去のrequestId: ${pastResult.requestId}`,
      `過去の修正内容: ${(pastResult.output || '').slice(0, 500)}`,
      `現象: ${logEntry.phenomenon || ''}`,
      `修正対象: ${logEntry.targetFunc || ''}`,
    ].join('\n');

    const targetFile = resolveTargetFile(logEntry.targetFunc || '');
    const res = await fetchWithTimeout('http://localhost:5000/api/code/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        instruction: instruction,
        requestId: logEntry.id + '_reuse',
        targetFile: targetFile,
      })
    }, 10000);

    if (!res.ok) return false;
    const data = await res.json();
    trackCodeFixProgress(data.requestId || logEntry.id + '_reuse');
    return true;
  } catch (e) {
    return false;
  }
}

async function verifyDiagnosis(diagnosis, verifyProvider) {
  const verifyPrompt = `あなたはOS_FOR_HUMAN AI会議室のコード検証官です。

【v2の実際のファイル構成】
- os_for_human_pipeline_v2.html（メインHTML・1300行）
- server.py（Flask API・localhost:5000）
- cmd_daemon.py（修正実行デーモン）
- launcher.py（起動管理・localhost:5001）

/api/server/ping, /api/claude, /api/gpt, /api/grok, /api/gemini,
/api/code/request, /api/code/result, /api/file/read, /api/file/edit,
/api/search/logs, /api/daemon/status, /api/logs/append

【server.pyに存在しないもの】
/chat, /api/chat は存在しない。index.html は存在しない。addMessage関数は存在しない。

【v2 HTMLに実在する関数】
callAI, pickProvider, getApiKeys, buildDiagnosisPrompt, extractDiagnosis,
sendChatMessage, appendChatBubble, saveDiagnosisLog, sendCodeFixRequest,
classifyQuery, checkServerHealth, trackCodeFixProgress

以下の診断が正確かチェックしてください:
ユーザー入力: ${diagnosis._userInput || '不明'}
修正対象: ${diagnosis.targetFunc}
現象: ${diagnosis.phenomenon}
原因: ${diagnosis.rootCause}
確信度: ${diagnosis.confidence || 'unknown'}

判定基準:
1. 修正対象に存在しないファイル・エンドポイントが含まれていないか。ただし関数名については：ユーザーが「追加しろ」「実装しろ」と指示している場合、まだ存在しない関数名が修正対象に含まれるのは当然。新規作成する関数なので基準1はPASS。基準1で落とすのは「存在しないファイル」「存在しないエンドポイント」のみ
2. 既に実装済みの機能を「未実装」と言ってないか（appendChatBubbleの第3引数でprovider表示は実装済み）
3. 原因分析が具体的か（一般論で逃げてないか）
4. 確信度がestimated/unknownの場合、実ファイルを確認しないと判断できない項目があるか

JSON形式で回答（これ以外出力禁止）:
{"passed": true/false, "unknown_items": ["実ファイル確認が必要な項目（あれば）"], "reason": "判定理由（1文）"}`;

  try {
    const answer = await callAI(verifyProvider, '検証官。JSON以外出力禁止。', verifyPrompt);
    const m = answer.match(/\{[^}]*"passed"\s*:\s*(true|false)[^}]*\}/);
    if (m) return JSON.parse(m.group ? m.group() : m[0]);
    return { passed: true, reason: '検証結果パース不可（通過扱い）' };
  } catch (e) {
    return { passed: true, reason: '検証AI呼び出し失敗（通過扱い）' };
  }
}

function resolveTargetFile(targetFunc) {
  const t = (targetFunc || '').toLowerCase();
  if (t.includes('server.py') || t.includes('/api/') || t.includes('flask') || t.includes('endpoint')) return 'server.py';
  if (t.includes('daemon') || t.includes('cmd_daemon') || t.includes('generate_edit') || t.includes('audit_fix')) return 'cmd_daemon.py';
  if (t.includes('launcher')) return 'launcher.py';
  return 'os_for_human_pipeline_v2.html';
}

async function sendCodeFixRequest(diagEntry) {
  if (diagEntry.taskType !== 'code_fix') {
    console.log('[CodeFix] taskType=' + diagEntry.taskType + ' → 送信しない');
    return null;
  }
  _codeFix進行中 = true; // リロード抑制

  if (!serverAlive) {
    appendChatBubble('system', '⚠️ server.py未起動のため、修正依頼を保留中。3秒間隔で復帰監視中 → 復帰次第自動再送します。');
    // 未送信キューに保存（重複防止 + server復帰時に自動再送）
    try {
      const pending = JSON.parse(localStorage.getItem('os4h_v2_pending_fixes') || '[]');
      if (!pending.some(p => p.id === diagEntry.id)) {
        pending.push(diagEntry);
        localStorage.setItem('os4h_v2_pending_fixes', JSON.stringify(pending));
      }
    } catch(e) {}
    return null;
  }

  // diagEntryに紐付けられた画像を使う（送信時に保持済み）
  const recentImages = diagEntry._images || [];

  // server.pyの /api/code/request は instruction フィールドを要求する
  const instructionParts = [
    `【修正依頼】`,
    `現象: ${diagEntry.phenomenon}`,
    `原因: ${diagEntry.rootCause}`,
    `修正対象: ${diagEntry.targetFunc}`,
    `禁止修正: ${(diagEntry.forbiddenFixes || []).join(', ')}`,
    `確認方法: ${diagEntry.verifyMethod}`,
    `ユーザー入力: ${diagEntry.user_input}`,
  ];
  if (recentImages.length > 0) {
    instructionParts.push(`【画像添付あり】スクリーンショット${recentImages.length}枚が添付されています。画像に映っているUI要素と実際のHTMLコードを照合して修正箇所を特定してください。`);
  }
  // AI回答にコードブロックが含まれていたらinstructionに追加（daemonがコピペできる）
  const lastAI = chatHistory.filter(m => m.role === 'assistant').slice(-1)[0];
  if (lastAI && lastAI.content) {
    const codeBlocks = lastAI.content.match(/```[\s\S]*?```/g);
    if (codeBlocks && codeBlocks.length > 0) {
      instructionParts.push(`\n【AIが提案したコード（そのまま使え）】`);
      codeBlocks.forEach(block => instructionParts.push(block));
      instructionParts.push(`上記コードをそのままコピーして挿入位置に配置すること。自分でコードを再生成するな。`);
    }
  }
  const instruction = instructionParts.join('\n');

  // 修正対象ファイルを診断から判定（server.py / cmd_daemon.py / v2.html 等）
  const targetFile = resolveTargetFile(diagEntry.targetFunc || '');

  const requestBody = {
    instruction: instruction,
    requestId: diagEntry.id,
    targetFile: targetFile,
    images: recentImages,
  };

  try {
    const res = await fetchWithTimeout('http://localhost:5000/api/code/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(requestBody)
    }, 10000);

    if (!res.ok) throw new Error(`server応答: ${res.status}`);
    const data = await res.json();
    const reqId = data.requestId || diagEntry.id;
    appendChatBubble('system', `🔧 修正依頼をClaude Codeに送信しました (${reqId})`);
    // 進捗追跡を開始
    trackCodeFixProgress(reqId);
    return data;
  } catch (e) {
    appendChatBubble('error', `修正依頼送信失敗: ${e.message}`);
    return null;
  } finally {
    // trackCodeFixProgressが完了を待つので、送信直後は解除しない
    // trackCodeFixProgress内でdaemon完了時に解除する
    if (!trackCodeFixProgress._active) _codeFix進行中 = false;
  }
}

  div.className = `chat-${type}`;

  const bodyHtml = type === 'ai' ? mdToHtml(text) : escHtml(text);
  div.innerHTML = `<div class="bubble-label">${label}</div><div class="bubble-body">${bodyHtml}</div>`;
  if (type === 'ai') {
    const btn = document.createElement('button');
    btn.textContent = '📋';
    btn.title = 'コピー';

    btn.onclick = () => {
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✓'; btn.style.color = '#50fa7b';
        setTimeout(() => { btn.textContent = '📋'; btn.style.color = '#888'; }, 1000);
      });

    div.appendChild(btn);
  }
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ─── メイン送信関数 ───
async function sendChatMessage() {
  _chatBusy = true; // リロード抑制開始
  // orchestrate実行中なら中断
  abortOrchestrate();

  let provider = document.getElementById('chatProvider').value;
  const rawMessage = document.getElementById('chatInput').value.trim();
  if (!rawMessage && chatFiles.length === 0 && chatImages.length === 0) return;

  // パイプラインモニター起動
  pipelineMonitor.show();
  pipelineMonitor.step('input', 'active', rawMessage.slice(0, 60));

  if (provider === 'auto') {
    provider = classifyQuery(rawMessage);
  }

  let fullMessage = rawMessage;
  if (chatFiles.length > 0) {
    const fileContent = chatFiles.map(f => `【添付ファイル: ${f.name}】\n${f.content.slice(0, 5000)}`).join('\n\n');
    fullMessage = fileContent + (rawMessage ? '\n\n' + rawMessage : '');
  }

  const imagesToSend = chatImages.map(img => img.dataUrl);
  const displayMsg = rawMessage + (chatFiles.length > 0 ? ` [📎×${chatFiles.length}]` : '') + (chatImages.length > 0 ? ` [🖼×${chatImages.length}]` : '');

  // 入力クリア
  const chatInput = document.getElementById('chatInput');
  chatInput.value = '';
  chatInput.style.height = 'auto';
  chatFiles = [];
  chatImages = [];
  renderChatAttachments();

  // 表示・履歴記録
  appendChatBubble('user', displayMsg);
  chatHistory.push({ role: 'user', content: fullMessage });
  chatLog.push({ role: 'user', provider, message: displayMsg, timestamp: new Date().toISOString() });
  saveChatLog();

  chatAbortController = new AbortController();
  pipelineMonitor.step('input', 'done', `${provider} / ${rawMessage.slice(0, 40)}`);
  appendChatBubble('system', `考え中... (${provider})`);

  try {
    // 会話履歴（自動圧縮: 10件超えたら古い分を要約に圧縮）
    let historyText = '';
    if (chatHistory.length > 10) {
      const oldPart = chatHistory.slice(0, -10);
      const recentPart = chatHistory.slice(-10);
      // 古い会話を1行要約に圧縮（AIに送らず自力で要約）
      const oldSummary = oldPart
        .filter(h => h.role === 'user')
        .map(h => (h.content || '').slice(0, 40))
        .join(' / ');
      historyText = `【過去の会話（${oldPart.length}件を圧縮）】${oldSummary}\n\n【直近の会話】\n` +
        recentPart.filter(h => h.role !== 'system')
          .map(h => `${h.role === 'user' ? '人間' : 'AI'}: ${(h.content || '').slice(0, 300)}`)
          .join('\n');
    } else {
      historyText = chatHistory
        .filter(h => h.role !== 'system')
        .map(h => `${h.role === 'user' ? '人間' : 'AI'}: ${h.content}`)
        .join('\n');
    }

    // ─── 過去ログ検索（3層: localStorage + 構造化ログ + FTS5） ───
    let pastContext = '';

    // 日本語対応キーワード抽出（スペース分割 + 2-4文字のスライディングウィンドウ）
    function extractKeywords(text) {
      const t = text.toLowerCase();
      // スペース・句読点で分割
      const spaceWords = t.split(/[\s、。！？「」（）\.,!?\(\)]+/).filter(w => w.length >= 2);
      // 日本語: 重要そうな2-4文字チャンクを抽出
      const jpChunks = [];
      const cleaned = t.replace(/[^\u3040-\u309f\u30a0-\u30ff\u4e00-\u9faf\u3400-\u4dbfa-z0-9_]/g, '');
      for (let i = 0; i < cleaned.length - 1; i++) {
        jpChunks.push(cleaned.slice(i, i + 2));
        if (i < cleaned.length - 2) jpChunks.push(cleaned.slice(i, i + 3));
      }
      // 重複除去して合体
      return [...new Set([...spaceWords, ...jpChunks])].slice(0, 20);
    }

    pipelineMonitor.step('search', 'active', '3層検索開始...');
    // 層1: pipelineHistory（localStorage）
    try {
      const allHistory = JSON.parse(localStorage.getItem('pipelineHistory') || '[]');
      if (allHistory.length > 0) {
        const words = extractKeywords(rawMessage);
        const relevant = allHistory.filter(entry => {
          const input = (entry.input || '').toLowerCase();
          const msgs = (entry.chatMessages || []).map(m => (m.message || '').toLowerCase()).join(' ');
          return words.some(w => input.includes(w) || msgs.includes(w));
        }).slice(-5);
        if (relevant.length > 0) {
          pastContext += '【ストーリーログから関連情報】\n' + relevant.map(e =>
            `[${e.timestamp ? new Date(e.timestamp).toLocaleDateString() : '?'}] ${(e.input || '').slice(0, 100)}`
          ).join('\n') + '\n\n';
        }
      }
    } catch (e) {}

    // 層2: 構造化診断ログ（過去のcode_fix結果・診断履歴）
    try {
      const diagLogs = JSON.parse(localStorage.getItem('os4h_v2_diagnosis_logs') || '[]');
      if (diagLogs.length > 0) {
        const words = extractKeywords(rawMessage);
        const relevant = diagLogs.filter(log => {
          const searchable = [log.user_input, log.phenomenon, log.rootCause, log.targetFunc].join(' ').toLowerCase();
          return words.some(w => searchable.includes(w));
        }).slice(-5);
        if (relevant.length > 0) {
          pastContext += '【構造化診断ログから関連情報】\n' + relevant.map(log =>
            `[${log.createdAt ? new Date(log.createdAt).toLocaleString() : '?'}] ${log.taskType}: ${(log.user_input || '').slice(0, 60)} → 現象: ${(log.phenomenon || '').slice(0, 60)}`
          ).join('\n') + '\n\n';
        }
      }
    } catch (e) {}

    // 層3: FTS5サーバー検索（143万行の過去ログ — serverAliveのときだけ）
    if (serverAlive) {
      try {
        const searchQuery = rawMessage.split(/\s+/).filter(w => w.length >= 2).slice(0, 3).join(' ');
        if (searchQuery) {
          const ftsRes = await fetchWithTimeout('http://localhost:5000/api/search/logs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: searchQuery, limit: 3 })
          }, 5000);
          if (ftsRes.ok) {
            const ftsData = await ftsRes.json();
            const hits = ftsData.results || ftsData.hits || [];
            if (hits.length > 0) {
              pastContext += '【過去ログDB（143万行）から関連情報】\n' + hits.map(h =>
                `[${h.source || '?'}] ${(h.content || h.snippet || '').slice(0, 120)}`
              ).join('\n') + '\n\n';
            }
          }
        }
      } catch (e) {}
    }

    pipelineMonitor.step('search', 'done', pastContext ? `コンテキスト取得済み (${pastContext.length}文字)` : 'ヒットなし');

    // 【事実収集】AI回答前に必要な情報を自動取得してpastContextに追加
    pipelineMonitor.step('facts', 'active', 'server問い合わせ中...');
    if (serverAlive) {
      const facts = await gatherFacts(rawMessage);
      if (facts) { pastContext += facts; pipelineMonitor.step('facts', 'done', `${facts.length}文字取得`); }
      else pipelineMonitor.step('facts', 'done', '追加事実なし');
    } else {
      pipelineMonitor.step('facts', 'skip', 'server未接続');
    }

    // 診断プロンプトでAI呼び出し（失敗時に別AIで自動リトライ）
    pipelineMonitor.step('ai_call', 'active', `${provider} に送信中...`);
    const systemPrompt = buildDiagnosisPrompt(rawMessage, historyText, pastContext, provider, imagesToSend.length > 0);
    let aiResponse = null;
    const tryOrder = [provider, ...['gpt', 'claude', 'gemini', 'grok'].filter(p => p !== provider)];
    for (const p of tryOrder) {
      try {
        pipelineMonitor.step('ai_call', 'active', `${p} 応答待ち...`);
        aiResponse = await callAI(p, systemPrompt, fullMessage, imagesToSend, { signal: chatAbortController.signal });
        if (aiResponse) { provider = p; break; }
      } catch (e) {
        if (e.name === 'AbortError') throw e;
        pipelineMonitor.step('ai_call', 'active', `${p} 失敗 → 次のAIへ`);
        console.log(`[chat] ${p} 失敗: ${e.message} → 次のAIで再試行`);
        continue;
      }
    }
    if (!aiResponse) { pipelineMonitor.step('ai_call', 'fail', '全AI応答不可'); throw new Error('全AIが応答不可'); }
    pipelineMonitor.step('ai_call', 'done', `${provider} 応答OK (${aiResponse.length}文字)`);

    // diagnosisブロック抽出（なければAIに再要求）
    pipelineMonitor.step('diagnosis', 'active', 'JSONブロック解析中...');
    let diagnosis = extractDiagnosis(aiResponse);
    if (!diagnosis) {
      try {
        const diagRetry = await callAI(provider, 'JSON以外出力禁止。',
          `以下のAI回答を分析し、diagnosisブロックだけ返してください。\n\n回答:\n${aiResponse.slice(0, 1500)}\n\nユーザー入力:\n${rawMessage}\n\n以下の形式で出力（これ以外禁止）:\n\`\`\`diagnosis\n{"phenomenon":"1文","rootCause":"1文","targetFunc":"関数名","forbiddenFixes":[],"verifyMethod":"1文","confidence":"estimated","taskType":"general/diagnose/code_fix/orchestrate"}\n\`\`\`\n\n判定基準: 「〜を追加しろ」「〜を実装しろ」「code_fixとして修正しろ」はcode_fixまたはorchestrate。`,
          [], { timeout: 15000 });
        if (diagRetry) diagnosis = extractDiagnosis(diagRetry);
      } catch(e) { console.log('[chat] diagnosis再要求失敗:', e.message); }
    }
    // フォールバック: それでもdiagnosisがなく、ユーザーが明示的にcode_fixを要求してる場合は強制生成
    if (!diagnosis && /code_fix|修正しろ|追加しろ|実装しろ/.test(rawMessage)) {
      console.log('[chat] diagnosis強制生成（ユーザーがcode_fix明示）');
      diagnosis = {
        phenomenon: rawMessage.slice(0, 80),
        rootCause: 'ユーザーが明示的にcode_fix修正を要求',
        targetFunc: 'sendChatMessage（ユーザー指示による新規追加）',
        forbiddenFixes: [],
        verifyMethod: 'ユーザー指示通りの実装を確認',
        confidence: 'confirmed',
        taskType: 'code_fix'
      };
    }
    if (diagnosis) {
      pipelineMonitor.step('diagnosis', 'done', `taskType=${diagnosis.taskType} / confidence=${diagnosis.confidence || '?'}`);
    } else {
      pipelineMonitor.step('diagnosis', 'done', 'diagnosisなし (general応答)');
    }
    const displayResponse = stripDiagnosisBlock(aiResponse);
    if (diagnosis) diagnosis._userInput = rawMessage;

    // 「考え中...」を消す
    removeLast('system');

    // 表示（検証前にAI回答を先に出す）
    appendChatBubble('ai', displayResponse, provider);

    // 【回答監査】別プロバイダーで事実チェック（バックグラウンド実行）
    pipelineMonitor.step('audit', 'active', 'バックグラウンド監査中...');
    auditAIResponse(displayResponse, rawMessage, provider);
    pipelineMonitor.step('audit', 'done', '監査開始済み (非同期)');

    // 【検証AI】code_fixの場合、別AIで診断内容を検証する
    // ただし「追加しろ」「実装しろ」等の新規追加指示は検証スキップ（新規関数は存在しなくて当然）
    const _isNewFeatureRequest = /追加|実装|新設|作れ|作って|入れろ|入れて/.test(rawMessage);
    if (diagnosis && diagnosis.taskType === 'code_fix' && !_isNewFeatureRequest) {
      try {
        const verifyProvider = pickProvider(['gemini', 'gpt', 'claude', 'grok'].filter(p => p !== provider));
        pipelineMonitor.step('verify', 'active', `${verifyProvider} で検証中...`);
        appendChatBubble('system', `🔍 検証中... ${provider}の診断を${verifyProvider}が検証`);
        const verified = await verifyDiagnosis(diagnosis, verifyProvider);
        removeLast('system');  // 「検証中...」だけ消す
        if (!verified.passed) {
          diagnosis.taskType = 'diagnose';
          diagnosis._verifyNote = verified.reason;
          pipelineMonitor.step('verify', 'fail', `降格: ${verified.reason.slice(0, 50)}`);
          appendChatBubble('system', `⚠️ 検証AI(${verifyProvider}): ${verified.reason} → code_fixをdiagnoseに降格`);
        } else {
          pipelineMonitor.step('verify', 'done', `承認: ${verified.reason.slice(0, 50)}`);
          appendChatBubble('system', `✅ 検証AI(${verifyProvider}): ${verified.reason} → code_fix承認`);
        }

        // 未知項目があればdaemonに調査依頼
        const unknowns = verified.unknown_items || [];
        if (unknowns.length > 0) {
          appendChatBubble('system', `🔍 未知項目 ${unknowns.length}件 → daemonに調査依頼`);
          sendUnknownInvestigation(unknowns, diagnosis);
        }
      } catch (e) {
        pipelineMonitor.step('verify', 'skip', `検証スキップ: ${e.message}`);
        appendChatBubble('system', `⚠️ 検証スキップ（${e.message}）`);
      }
    } else if (diagnosis && diagnosis.taskType === 'code_fix' && _isNewFeatureRequest) {
      pipelineMonitor.step('verify', 'skip', '新規追加のため検証スキップ');
    } else {
      pipelineMonitor.step('verify', 'skip', 'code_fix以外');
    }

    // 履歴保存 - 実際に使用されたプロバイダーを記録
    chatHistory.push({ role: 'assistant', content: displayResponse });
    chatLog.push({ role: 'ai', provider: provider, message: displayResponse, timestamp: new Date().toISOString() });
    saveChatLog();

    // ストーリーログ保存
    saveChatToStoryLog(provider, displayMsg, displayResponse);

    // 【FTS5追記】chat会話を143万行ログDBに蓄積（serverAliveのとき）
    if (serverAlive) {
      try {
        fetchWithTimeout('http://localhost:5000/api/logs/append-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entries: [
            { source: 'v2_chat', topic: 'chat', role: 'user', content: rawMessage, created_at: new Date().toISOString() },
            { source: 'v2_chat', topic: 'chat', role: 'ai_' + provider, content: displayResponse.slice(0, 2000), created_at: new Date().toISOString() },
          ]})
        }, 5000);
      } catch (e) {}
    }

    // 【層3】構造化ログ保存（必須）— カード表示より先にIDを確定させる
    const logEntry = saveDiagnosisLog(rawMessage, aiResponse, diagnosis, provider);
    // 送信時の画像をlogEntryに紐付ける（code_fix時にdaemonに渡すため）
    logEntry._images = imagesToSend;

    // 診断カード表示（logEntry.idを注入してからカード生成）
    if (diagnosis) {
      diagnosis.id = logEntry.id;
      appendDiagnosisCard(diagnosis);
    }

    // 【層3.5】code_fix前に実コード確認（既に実装済みなら止める）
    if (diagnosis && (diagnosis.taskType === 'code_fix' || diagnosis.taskType === 'orchestrate') && serverAlive) {
      pipelineMonitor.step('precheck', 'active', '実コード確認中...');
      const alreadyDone = await checkAlreadyImplemented(diagnosis);
      if (alreadyDone) {
        diagnosis.taskType = 'diagnose';
        pipelineMonitor.step('precheck', 'done', `既に実装済み: ${alreadyDone.slice(0, 40)}`);
        appendChatBubble('system', `📄 実コード確認: ${alreadyDone} → 既に実装済みのためcode_fixを中止`);
      } else {
        pipelineMonitor.step('precheck', 'done', '未実装 → 修正へ進む');
      }
    } else {
      pipelineMonitor.step('precheck', 'skip', 'code_fix以外 or server未接続');
    }

    // 【層4】code_fixのときだけ修正依頼（過去ログ再利用 → daemon新規の順）
    if (diagnosis && diagnosis.taskType === 'code_fix') {
      pipelineMonitor.step('codefix', 'active', 'code_fix開始...');
      const pastFix = await searchPastFix(diagnosis);
      if (pastFix) {
        // 過去に同じ修正が成功してる → 再利用
        pipelineMonitor.step('codefix', 'active', '過去ログから再利用中...');
        appendChatBubble('system', `📋 過去ログに同じ修正あり → 再利用 (${pastFix.requestId})`);
        const reused = await applyPastFix(pastFix, logEntry);
        if (reused) {
          pipelineMonitor.step('codefix', 'done', '過去ログから再適用完了');
          appendChatBubble('system', `✅ 過去の修正を再適用しました`);
        } else {
          pipelineMonitor.step('codefix', 'active', '再適用失敗 → daemonに新規依頼');
          appendChatBubble('system', `⚠️ 過去の修正の再適用に失敗 → daemonに新規依頼`);
          await sendCodeFixRequest(logEntry);
          pipelineMonitor.step('codefix', 'done', 'daemon送信完了');
        }
      } else {
        pipelineMonitor.step('codefix', 'active', 'daemonに新規送信中...');
        await sendCodeFixRequest(logEntry);
        pipelineMonitor.step('codefix', 'done', 'daemon送信完了');
      }
    } else if (diagnosis && diagnosis.taskType === 'orchestrate') {
      // 【層5】orchestrateの場合 — タスク分解→順次実行
      pipelineMonitor.step('codefix', 'active', 'orchestrate開始...');
      await runOrchestrate(rawMessage, diagnosis, logEntry, provider, imagesToSend);
      pipelineMonitor.step('codefix', 'done', 'orchestrate完了');
    } else {
      pipelineMonitor.step('codefix', 'skip', '修正不要');
    }

  } catch (e) {
    removeLast('system');
    if (e.name === 'AbortError') {
      appendChatBubble('system', '⏹ 中止しました');
      pipelineMonitor.finish(false);
    } else {
      appendChatBubble('error', `エラー: ${e.message}`);
      pipelineMonitor.finish(false);
    }
    return;
  } finally {
    chatAbortController = null;
    _chatBusy = false; // リロード抑制解除
  }
  pipelineMonitor.finish(true);
}

// ─── code_fix 進捗追跡 ───
function trackCodeFixProgress(requestId, retryCount = 0, originalInstruction = '') {
  trackCodeFixProgress._active = true;
  _codeFix進行中 = true;
  let elapsed = 0;
  const interval = 5000;
  const maxWait = 180000;
  const maxRetries = 3;

  const progressId = `progress-${requestId}`;
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.id = progressId;
  div.className = 'chat-system';
  const retryLabel = retryCount > 0 ? ` [リトライ ${retryCount}/${maxRetries}]` : '';
  div.innerHTML = `<div class="bubble-label">daemon${retryLabel}</div><div class="bubble-body" id="${progressId}-body">⏳ daemon受付待ち... (0秒)</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;

  const timer = setInterval(async () => {
    elapsed += interval;
    const sec = Math.round(elapsed / 1000);
    const body = document.getElementById(`${progressId}-body`);

    if (elapsed >= maxWait) {
      clearInterval(timer);
      _codeFix進行中 = false;
      trackCodeFixProgress._active = false;
      if (body) body.textContent = `❌ ${sec}秒経過 -daemon応答なし`;
      return;
    }

    if (body) {
      if (sec < 15) body.textContent = `⏳ daemon受付待ち... (${sec}秒)`;
      else if (sec < 30) body.textContent = `⏳ Claude API + 編集生成中... (${sec}秒)`;
      else if (sec < 60) body.textContent = `⏳ まだ実行中... (${sec}秒)`;
      else body.textContent = `⏳ まだ反応ない... (${sec}秒)`;
    }

    try {
      const res = await fetchWithTimeout(`http://localhost:5000/api/code/result/${requestId}`, {}, 3000);
      if (!res.ok) return;
      const data = await res.json();
      if (data.status === 'pending' || data.status === 'not_found') return;

      clearInterval(timer);
      _codeFix進行中 = false;
      trackCodeFixProgress._active = false;
      const audit = data.audit || {};
      const passed = audit.passed || data.status === 'completed';
      const reason = audit.reason || '';
      const changed = data.file_changed;

      if (passed) {
        if (body) body.textContent = `✅ 修正完了 (${sec}秒) -${reason}`;
        div.style.borderLeftColor = '#50fa7b';
      } else {
        // ── 差戻しロジック: 失敗→原因分析→別アプローチ ──
        let msg = `❌ 失敗 (${sec}秒) -${reason || 'ファイル変更なし'}`;
        if (body) body.textContent = msg;
        div.style.borderLeftColor = '#ff5555';

        if (retryCount < maxRetries) {
          appendChatBubble('system', `🔄 差戻し: 失敗原因を分析して別アプローチを試みます (${retryCount + 1}/${maxRetries})`);
          await autoRepairCodeFix(requestId, reason, data, retryCount, originalInstruction);
        } else {
          appendChatBubble('system', `🛑 ${maxRetries}回失敗。自動修復を中止します。手動で対応してください。`);
        }
      }
    } catch (e) {}
  }, interval);
}

// ── 差戻し: 失敗原因を分析して別アプローチでcode_fixを再送 ──
async function autoRepairCodeFix(failedId, failReason, failData, retryCount, originalInstruction) {
  // 失敗した修正依頼の元instructionを取得
  let origInst = originalInstruction;
  if (!origInst) {
    try {
      const res = await fetchWithTimeout(`http://localhost:5000/api/file/read`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: `code_requests/done/${failedId}_meta.json` })
      }, 3000);
    } catch(e) {}
  }

  // HTMLはリカバリーログを書くだけ。実行はdaemonの仕事。
  const targetFile = failData.targetFile || 'os_for_human_pipeline_v2.html';
  const retryId = `${failedId}_retry${retryCount + 1}`;

  const recoveryInstruction = [
    '【リカバリー依頼】',
    `前回の修正 (${failedId}) が失敗した。別のアプローチで再試行せよ。`,
    `失敗理由: ${failReason}`,
    `失敗詳細: ${(failData.output || '').slice(0, 300)}`,
    `元の依頼: ${origInst || '不明'}`,
    '',
    '【リカバリールール】',
    '- /api/file/read で対象ファイルの実コードを読んでから編集を生成すること',
    '- old_stringはファイル内に実在する文字列を正確にコピーすること',
    '- 前回と同じold_stringは使うな（前回404で失敗している）',
    '- 既に実装済みの機能を重複追加するな',
    '- 1つの検索置換で完結する最小限の変更にすること',
  ].join('\n');

  try {
    const res = await fetchWithTimeout('http://localhost:5000/api/code/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        instruction: recoveryInstruction,
        requestId: retryId,
        targetFile: targetFile,
      })
    }, 10000);

    if (res.ok) {
      appendChatBubble('system', `🔄 リカバリー送信 (${retryId}) → daemonが実コードを読んで再試行`);
      trackCodeFixProgress(retryId, retryCount + 1, recoveryInstruction);
    } else {
      appendChatBubble('system', `⚠️ リカバリー: 再送信失敗`);
    }
  } catch (e) {
    appendChatBubble('system', `⚠️ リカバリー失敗: ${e.message}`);
  }
}

// ─── キュー詰まり自動検知 → 掃除 + daemon再起動 ───
let _lastQueueCount = 0;
let _queueStuckSince = 0;
const QUEUE_STUCK_THRESHOLD = 60000; // 60秒キューが減らなかったら詰まり判定

async function autoDetectQueueStuck() {
  if (!serverAlive || !daemonAlive) return;
  try {
    const res = await fetchWithTimeout('http://localhost:5000/api/code/queue/count', {}, 3000);
    if (!res.ok) return;
    const data = await res.json();
    const count = data.count || 0;

    if (count > 0 && count === _lastQueueCount) {
      // キューが減ってない
      if (_queueStuckSince === 0) _queueStuckSince = Date.now();
      const stuck = Date.now() - _queueStuckSince;
      if (stuck > QUEUE_STUCK_THRESHOLD) {
        console.log(`[v2] キュー詰まり検知 (${count}件, ${Math.round(stuck/1000)}秒停滞) → 自動掃除+daemon再起動`);
        appendChatBubble('system', `🧹 キュー詰まり検知 (${count}件停滞) → 自動掃除+daemon再起動中...`);
        await cleanQueue();
        await restartDaemon();
        _queueStuckSince = 0;
      }
    } else {
      // キューが動いてるか空
      _queueStuckSince = 0;
    }
    _lastQueueCount = count;
  } catch (e) {}
}
setInterval(autoDetectQueueStuck, 15000);

function saveChatToStoryLog(provider, userMsg, aiResponse) {
  const history = JSON.parse(localStorage.getItem('pipelineHistory') || '[]');
  const lastEntry = history[history.length - 1];
  const isRecentChat = lastEntry && lastEntry.type === 'chat'
    && (Date.now() - new Date(lastEntry.lastUpdated || lastEntry.timestamp).getTime()) < 30 * 60 * 1000;

  if (isRecentChat) {
    lastEntry.chatMessages.push(
      { role: 'user', provider, message: userMsg, timestamp: new Date().toISOString() },
      { role: 'ai', provider, message: aiResponse, timestamp: new Date().toISOString() }
    );
    lastEntry.lastUpdated = new Date().toISOString();
    lastEntry.messageCount = lastEntry.chatMessages.length;
  } else {
    history.push({
      type: 'chat', timestamp: new Date().toISOString(), lastUpdated: new Date().toISOString(),
      inputShort: userMsg.substring(0, 60) + (userMsg.length > 60 ? '...' : ''),
      input: userMsg, finalStatus: 'CHAT',
      chatMessages: [
        { role: 'user', provider, message: userMsg, timestamp: new Date().toISOString() },
        { role: 'ai', provider, message: aiResponse, timestamp: new Date().toISOString() }
      ],
      messageCount: 2, retryHistory: []
    });
  }
  if (history.length > 100) history.splice(0, history.length - 100);
  try { localStorage.setItem('pipelineHistory', JSON.stringify(history)); } catch(e) {}
}

// server.py疎通チェック（通常15秒 / 未起動時3秒に加速 / 復帰時に自動再送）
let _serverCheckTimer = null;
const LAUNCHER_URL = 'http://localhost:5001';

async function checkServerHealth() {
  try {
    const res = await fetchWithTimeout('http://localhost:5000/api/server/ping', {}, 3000);
    if (res.ok) {
      const wasDown = !serverAlive;
      serverAlive = true;
      document.getElementById('statusDot').classList.add('ok');
      updateRecoveryBar();
      if (wasDown) {
        console.log('[v2] server.py復帰検知 → 通常間隔に戻す + 未送信キュー再送');
        scheduleServerCheck(15000);
        await resendPendingFixes();
      }
      // server生きてたらdaemonも確認
      await checkDaemonStatus();
    }
  } catch (e) {
    const wasUp = serverAlive;
    serverAlive = false;
    document.getElementById('statusDot').classList.remove('ok');
    updateRecoveryBar();
    if (wasUp) {
      console.log('[v2] server.py切断検知 → 3秒間隔で復帰監視 + 復旧バー表示');
      scheduleServerCheck(3000);
    }
  }
}

let daemonAlive = false;

let _daemonDeadCount = 0;
let _daemonRecovering = false;

async function checkDaemonStatus() {
  if (!serverAlive) { daemonAlive = false; return; }
  try {
    const res = await fetchWithTimeout('http://localhost:5000/api/daemon/status', {}, 3000);
    if (res.ok) {
      const data = await res.json();
      daemonAlive = data.alive;
    }
  } catch (e) { daemonAlive = false; }
  updateRecoveryBar();

  // daemon死亡検知 → launcher経由で自動復旧（3回連続死亡で発火）
  if (!daemonAlive && serverAlive && !_daemonRecovering) {
    _daemonDeadCount++;
    if (_daemonDeadCount >= 3) {
      _daemonRecovering = true;
      _daemonDeadCount = 0;
      console.log('[v2] daemon死亡検知 → launcher経由で自動復旧');
      try {
        await fetchWithTimeout('http://localhost:5001/daemon/start', { method: 'POST' }, 15000);
        setTimeout(async () => {
          await checkDaemonStatus();
          _daemonRecovering = false;
        }, 5000);
      } catch(e) {
        console.log('[v2] daemon自動復旧失敗:', e.message);
        _daemonRecovering = false;
      }
    }
  } else if (daemonAlive) {
    _daemonDeadCount = 0;
  }
}

function updateRecoveryBar() {
  const bar = document.getElementById('serverRecoveryBar');
  const label = document.getElementById('recoveryLabel');
  if (!serverAlive) {
    bar.classList.add('visible');
    label.textContent = 'server.py 未起動';
  } else if (!daemonAlive) {
    bar.classList.add('visible');
    label.textContent = 'Claude Code デーモン 未起動（修正依頼が実行されません）';
  } else {
    bar.classList.remove('visible');
  }
}

async function recoverAll() {
  const btn = document.getElementById('btnRecoverServer');
  const status = document.getElementById('recoveryStatus');
  btn.disabled = true;
  btn.textContent = '起動中...';
  status.textContent = '';

  try {
    // launcher.py (port 5001) に全起動要求
    const res = await fetchWithTimeout(`${LAUNCHER_URL}/start-all`, { method: 'POST' }, 30000);
    const data = await res.json();

    const srvOk = data.server && (data.server.status === 'started' || data.server.status === 'already_running');
    const dmnOk = data.daemon && (data.daemon.status === 'started' || data.daemon.status === 'already_running' || data.daemon.status === 'started_no_ping');

    if (srvOk && dmnOk) {
      btn.textContent = '✅ 全起動完了';
      btn.style.background = '#2a6';
      btn.style.animation = 'none';
      status.textContent = `server: ${data.server.status} / daemon: ${data.daemon.status}`;
      status.style.color = '#50fa7b';
      document.getElementById('recoveryLabel').textContent = '全サービス起動中';
      document.getElementById('recoveryLabel').style.color = '#50fa7b';
      // 2秒後にバー非表示
      setTimeout(() => { checkServerHealth(); checkDaemonStatus(); }, 2000);
    } else if (srvOk) {
      btn.textContent = 'server起動済み';
      btn.disabled = false;
      status.textContent = `daemon: ${data.daemon?.error || data.daemon?.status || '不明'}`;
    } else {
      btn.textContent = '起動する';
      btn.disabled = false;
      status.textContent = `server: ${data.server?.error || '不明'} / daemon: ${data.daemon?.error || '不明'}`;
    }
  } catch (e) {
    btn.textContent = '起動する';
    btn.disabled = false;
    status.textContent = 'launcher.py も未起動。PC再起動で自動復帰します';
    status.style.color = '#ff6b6b';
  }
}

function scheduleServerCheck(intervalMs) {
  if (_serverCheckTimer) clearInterval(_serverCheckTimer);
  _serverCheckTimer = setInterval(checkServerHealth, intervalMs);
}

async function resendPendingFixes() {
  try {
    const pending = JSON.parse(localStorage.getItem('os4h_v2_pending_fixes') || '[]');
    if (pending.length === 0) return;
    const failed = [];
    let successCount = 0;
    for (const entry of pending) {
      const result = await sendCodeFixRequest(entry);
      if (result) {
        successCount++;
      } else {
        failed.push(entry);
      }
    }
    // 成功分だけ削除、失敗分はキューに残す
    if (failed.length > 0) {
      localStorage.setItem('os4h_v2_pending_fixes', JSON.stringify(failed));
    } else {
      localStorage.removeItem('os4h_v2_pending_fixes');
    }
    if (successCount > 0) {
      appendChatBubble('system', `📤 保留中の修正依頼 ${successCount}/${pending.length}件を自動再送しました` + (failed.length > 0 ? `（${failed.length}件失敗・キュー残留）` : ''));
    }
  } catch (e) {
    console.warn('[v2] 未送信キュー再送失敗:', e.message);
  }
}

(async function autoHealthCheck() {
  const keys = getApiKeys();
  for (const [provider, cfg] of Object.entries(MODELS)) {
    const key = keys[provider];
    if (!key) continue;
    try {
      let res;
      if (provider === 'gemini') {
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent?key=${key}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'ping' }] }], generationConfig: { maxOutputTokens: 1 } })
        });
      } else if (provider === 'claude') {
        res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify({ model: cfg.model, max_tokens: 1, messages: [{ role: 'user', content: 'ping' }] })
        });
      } else if (provider === 'gpt') {
        res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST', headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: cfg.model, max_tokens: 1, messages: [{ role: 'user', content: 'ping' }] })
        });
      } else if (provider === 'grok') {
        res = await fetch('https://api.x.ai/v1/chat/completions', {
          method: 'POST', headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: cfg.model, max_tokens: 1, messages: [{ role: 'user', content: 'ping' }] })
        });
      }
      if (res && res.ok) { console.log(`[HealthCheck] ${provider}: OK`); continue; }
      if (res && res.status === 404) {
        const fallbacks = FALLBACK_MODELS[provider] || [];
        for (const fb of fallbacks) {
          if (fb === cfg.model) continue;
          MODELS[provider].model = fb;
          console.log(`[HealthCheck] ${provider}: → ${fb}`);
          showToast(`${provider.toUpperCase()}: モデルを ${fb} に更新`, 5000);
          break;
        }
      }
    } catch (e) {
      console.warn(`[HealthCheck] ${provider}: ${e.message}`);
    }
  }
})();

        const response = await fetch('http://localhost:5001/start-all', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        });

        if (response.ok) {
            const result = await response.text();
            alert(`全再起動完了: ${result}`);
        } else {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
    } catch (error) {
        alert(`全再起動エラー: ${error.message}`);
    }
}

// ─── リカバリー処理の強化 ───
function handleRetryRequest(requestId) {
  try {
    console.log(`[v2] リトライ処理開始: ${requestId}`);
    
    // リトライ状況をログに記録
    const retryLog = {
      id: requestId,
      timestamp: Date.now(),
      type: 'retry_attempt',
      status: 'processing'
    };
    
    // ローカルストレージに記録
    const retryHistory = JSON.parse(localStorage.getItem('retryHistory') || '[]');
    retryHistory.push(retryLog);
    localStorage.setItem('retryHistory', JSON.stringify(retryHistory));
    
    showToast('リトライ処理を実行中...', 3000);
    return true;
  } catch (e) {
    console.error('[v2] リトライ処理エラー:', e);
    return false;
  }
}
