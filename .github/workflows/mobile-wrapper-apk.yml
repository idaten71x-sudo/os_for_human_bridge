name: Build OSFH Mobile Wrapper APK

on:
  push:
    branches:
      - osfh-mobile-wrapper-prototype
    paths:
      - 'mobile-wrapper/**'
      - '.github/workflows/mobile-wrapper-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: mobile-wrapper
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: osfh-chat-wrapper-apk
          path: mobile-wrapper/app/build/outputs/apk/debug/app-debug.apk
