<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS_FOR_HUMAN v3 — AI会議室</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #111111;
  --bg-tertiary: #1a1a1a;
  --bg-input: #0d0d0d;
  --border: #222;
  --border-active: #444;
  --text-primary: #e0e0e0;
  --text-secondary: #888;
  --text-muted: #555;
  --accent-claude: #d4a27a;
  --accent-gpt: #74aa9c;
  --accent-grok: #e44d4d;
  --accent-gemini: #8b9cf7;
  --accent-orch: #e0c060;
  --status-ok: #4a7;
  --status-err: #c44;
  --status-warn: #ca4;
  --status-active: #6af;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Noto Sans JP', 'JetBrains Mono', monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── HEADER ─── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg-secondary); flex-shrink: 0;
}
.header .btn-header#resolutionTab,
.header .btn-header#diffTab {
  display: none;
}
.logo { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; letter-spacing: 2px; }
.logo span { color: var(--accent-orch); font-size: 11px; margin-left: 8px; font-weight: 400; }
.header-right { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.btn-header.dev-only { display: none; }
.btn-header {
  background: none; border: 1px solid var(--border); color: var(--text-secondary);
  padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
  cursor: pointer; transition: all 0.15s;
}
.btn-header:hover { border-color: var(--border-active); color: var(--text-primary); }
.dev-only { display: none; }
body.dev-mode .dev-only { display: inline-block; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); transition: background 0.3s; }
.status-dot.ok { background: var(--status-ok); }
.status-dot.err { background: var(--status-err); }

/* ─── 3カラム MAIN ─── */
.main { flex: 1; display: flex; overflow: hidden; }

/* ─── 左サイドバー: ラベル+ツリー ─── */
.sidebar-left {
  width: 220px; display: flex; flex-direction: column;
  background: var(--bg-primary); flex-shrink: 0; border-right: 1px solid var(--border);
}
.sidebar-left .sb-header {
  padding: 10px 14px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted);
  letter-spacing: 1px; display: flex; align-items: center; justify-content: space-between;
}
.session-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.session-list::-webkit-scrollbar { width: 4px; }
.session-list::-webkit-scrollbar-thumb { background: var(--border); }
.label-group { margin-bottom: 2px; }
.label-header {
  display: flex; align-items: center; gap: 6px; padding: 7px 12px;
  cursor: pointer; user-select: none; transition: background 0.1s;
}
.label-header:hover { background: var(--bg-tertiary); }
.label-arrow { font-size: 10px; color: var(--text-muted); width: 12px; text-align: center; transition: transform 0.15s; }
.label-group.open > .label-header > .label-arrow { transform: rotate(90deg); }
.label-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.label-name { font-size: 12px; color: var(--text-primary); flex: 1; }
.label-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); }
.label-children { display: none; padding-left: 12px; }
.label-group.open > .label-children { display: block; }
.tree-item {
  display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 16px;
  cursor: pointer; border-left: 2px solid transparent; transition: all 0.1s;
  font-size: 11px; color: var(--text-secondary);
}
.tree-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.tree-item.active { background: var(--bg-tertiary); border-left-color: var(--accent-orch); color: var(--text-primary); }
.tree-item .t-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-item .t-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 1px 5px; border-radius: 3px;
}
.t-badge.active-s { background: #1f3a5f; color: #58a6ff; }
.t-badge.hold { background: #3a2a1a; color: #e0c060; }
.t-badge.done { background: #1a3a2a; color: #50fa7b; }
.sidebar-divider { height: 1px; background: var(--border); margin: 6px 12px; }

/* ─── メイン中央: AI議事録 ─── */
.conference-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.conference-header {
  padding: 0 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.conf-tabs { display: flex; gap: 0; }
.conf-tab {
  padding: 8px 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
  cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-muted); transition: all 0.15s;
}
.conf-tab.active { color: var(--accent-orch); border-bottom-color: var(--accent-orch); }
.conf-tab:hover { color: var(--text-secondary); }
.conference-body {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 8px;
}
.conference-body::-webkit-scrollbar { width: 4px; }
.conference-body::-webkit-scrollbar-thumb { background: var(--border); }

/* AI発言カード */
.ai-msg {
  background: #1a1a2e; padding: 14px 18px; margin: 4px auto;
  border-radius: 8px; max-width: 650px; width: 100%; position: relative;
}
.ai-msg.claude { border-left: 3px solid var(--accent-claude); }
.ai-msg.gpt { border-left: 3px solid var(--accent-gpt); }
.ai-msg.gemini { border-left: 3px solid var(--accent-gemini); }
.ai-msg.grok { border-left: 3px solid var(--accent-grok); }
.ai-msg.system-msg { border-left: 3px solid var(--accent-orch); max-width: 70%; width: 70%; }
.ai-msg.user-interrupt { border-left: 3px solid #4fc3f7; background: #0d1a2e; }
.ai-name { font-size: 12px; color: #666; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.ai-name.claude { color: var(--accent-claude); }
.ai-name.gpt { color: var(--accent-gpt); }
.ai-name.gemini { color: var(--accent-gemini); }
.ai-name.grok { color: var(--accent-grok); }
.ai-name.system { color: var(--accent-orch); }
.ai-name.user { color: #4fc3f7; }
.ai-role {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted);
  background: var(--bg-tertiary); padding: 1px 6px; border-radius: 3px;
}
.ai-body {
  color: #d4d4d4; font-size: 15px; line-height: 1.7;
  font-family: 'Noto Sans JP', -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
}
.ai-body p { margin: 10px 0; }
.ai-body p:first-child { margin-top: 0; }
.ai-body p:last-child { margin-bottom: 0; }
.ai-body code {
  background: #0d1117; border: 1px solid var(--border); padding: 1px 5px;
  border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #8be9fd;
}
.msg-number {
  position: absolute; top: 8px; right: 10px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted);
  background: var(--bg-tertiary); padding: 1px 6px; border-radius: 3px;
}
.section-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted);
  letter-spacing: 2px; padding: 12px 0 4px; text-align: center;
  max-width: 650px; margin: 0 auto; width: 100%;
}
.agenda-card {
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; margin: 0 auto 8px; max-width: 650px; width: 100%;
}
.agenda-card h3 { font-family: 'Noto Sans JP', sans-serif; font-size: 13px; color: var(--accent-orch); margin-bottom: 4px; }
.agenda-card p { font-size: 12px; color: var(--text-secondary); }
.decision-card {
  background: #0d1117; border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; margin: 8px auto; max-width: 650px; width: 100%;
}
.decision-card h4 { color: #50fa7b; margin-bottom: 8px; font-size: 13px; }
.decision-card .verdict { color: #d4d4d4; font-size: 13px; line-height: 1.7; font-family: 'Noto Sans JP', sans-serif; }
.decision-card .vote {
  display: flex; gap: 12px; margin-top: 8px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
}
.vote-approve { color: #50fa7b; }
.topic-tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
  background: #1a3a2a; color: #50fa7b; margin-right: 4px;
}
.topic-tag.fix { background: #3a1a1a; color: #ff6b6b; }
/* ─── スレッドラベル ─── */
.thread-badge {
  display: inline-block; padding: 1px 6px; border-radius: 3px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
  margin-left: 6px; cursor: pointer; opacity: 0.8; vertical-align: middle;
}
.thread-badge:hover { opacity: 1; }
.thread-filter-bar {
  display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 12px;
  border-bottom: 1px solid var(--border); min-height: 24px;
}
.thread-filter-btn {
  padding: 2px 8px; border-radius: 3px; border: 1px solid var(--border);
  background: var(--bg-tertiary); color: var(--text-secondary);
  font-family: 'JetBrains Mono', monospace; font-size: 10px; cursor: pointer;
}
.thread-filter-btn:hover { border-color: var(--border-active); color: var(--text-primary); }
.thread-filter-btn.active { border-color: var(--accent-claude); color: var(--text-primary); background: #1a1510; }
.ai-msg.thread-dimmed { display: none; }
/* 入力中インジケーター */
.typing-indicator {
  max-width: 650px; width: 100%; margin: 4px auto; padding: 8px 18px;
  font-size: 12px; color: var(--text-muted); display: none;
}
.typing-indicator.visible { display: block; }
.typing-dots { display: inline-block; }
.typing-dots span {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-muted); margin: 0 2px; animation: typingBounce 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

/* ─── 入力バー ─── */
.input-bar {
  border-top: 1px solid var(--border); background: var(--bg-secondary);
  padding: 10px 16px; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
}
.input-bar textarea {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary);
  padding: 8px 12px; font-family: 'Noto Sans JP', sans-serif; font-size: 13px;
  border-radius: 6px; resize: none; min-height: 40px; max-height: 120px; outline: none;
}
.input-bar textarea:focus { border-color: var(--border-active); }
.input-bar select {
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text-secondary);
  padding: 6px 8px; font-size: 11px; border-radius: 4px; outline: none;
}
.input-bar button {
  background: #58a6ff; border: none; color: #000; padding: 8px 16px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.input-bar button:hover { opacity: 0.85; }

/* ─── 右サイドバー ─── */
.sidebar-right {
  width: 320px; display: flex; flex-direction: column;
  background: var(--bg-primary); flex-shrink: 0; border-left: 1px solid var(--border);
}
.sidebar-section {
  padding: 10px 14px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
}
.sidebar-section .conf-title {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--accent-orch);
}
.sidebar-section .conf-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sidebar-header {
  padding: 10px 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted);
  letter-spacing: 1px; display: flex; align-items: center; justify-content: space-between;
}
.sidebar-header .badge { font-size: 10px; color: var(--accent-orch); }

/* パイプラインバー */
.pipeline-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  padding: 8px 14px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
}
.pipe-step {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted);
  padding: 3px 8px; border-radius: 3px; background: var(--bg-tertiary); white-space: nowrap;
}
.pipe-step.active { color: var(--status-active); background: #1f3a5f; }
.pipe-step.done { color: #50fa7b; background: #1a3a2a; }
.pipe-arrow { color: var(--text-muted); font-size: 10px; }

/* 右サイドバー chat履歴 */
.chat-messages { flex: 1; overflow-y: auto; padding: 8px 0; display: flex; flex-direction: column; }
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); }
.chat-bubble { padding: 10px 14px; border-radius: 8px; font-size: 18px; line-height: 1.6; }
.chat-user { 
  max-width: 70%; margin-left: auto; margin-right: 16px; margin-bottom: 12px;
  background: #1a1a2e; border-left: 3px solid #4fc3f7; padding: 14px 18px; border-radius: 8px;
}
.chat-ai-reply {
  max-width: 70%; margin-left: 16px; margin-right: auto; margin-bottom: 12px;
  background: #1a1a2e; border-left: 3px solid #50fa7b; padding: 14px 18px; border-radius: 8px;
}
.chat-status { background: #1a1a2e; border-left: 3px solid var(--text-muted); padding: 10px 14px; border-radius: 6px; font-size: 13px; color: var(--text-secondary); }
.chat-label { font-size: 12px; color: #666; margin-bottom: 4px; }
.chat-bubble .body {
  color: #d4d4d4; font-size: 19px; line-height: 1.7;
  font-family: 'Noto Sans JP', -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
}

/* ─── TOAST ─── */
#toastMsg {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 8px 20px; border-radius: 8px;
  font-size: 12px; display: none; z-index: 10000;
}

/* ─── RECOVERY BAR ─── */
#serverRecoveryBar {
  display: none; padding: 10px 16px; background: #1a0a0a; border-bottom: 1px solid #c44;
  text-align: center; font-size: 12px; color: #ff6b6b; align-items: center; justify-content: center; gap: 12px;
}
#serverRecoveryBar.visible { display: flex; }
#btnRecoverServer {
  background: #c44; color: #fff; border: none; padding: 6px 16px; border-radius: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  cursor: pointer; animation: blink-red 1s infinite;
}
@keyframes blink-red { 0%, 100% { background: #c44; } 50% { background: #ff6b6b; box-shadow: 0 0 8px #ff6b6b; } }

/* onboard guide */
.onboard-guide { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin: 20px auto; max-width: 600px; }
.onboard-guide h3 { margin: 0 0 12px; color: var(--text-primary); font-size: 16px; }
.onboard-guide p { color: var(--text-secondary); font-size: 14px; margin: 8px 0; }
.key-btn { display: inline-block; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin: 4px; text-decoration: none; }

/* ─── 左右分けレイアウト ─── */
.ai-msg.user-interrupt {
  margin-left: auto;
  margin-right: 16px;
  max-width: 70%;
  text-align: right;
}
.ai-msg.claude,
.ai-msg.gpt,
.ai-msg.gemini,
.ai-msg.grok {
  margin-left: 16px;
  margin-right: auto;
  max-width: 70%;
  text-align: left;
}
.ai-msg.system-msg {
  margin: 0 auto;
  max-width: 90%;
  text-align: center;
}
</style>
</head>
<body>

<!-- ─── HEADER ─── -->
<div class="header">
  <div class="logo">OS_FOR_HUMAN <span>v3 — AI会議室</span></div>
  <div class="header-right">
    <div class="status-dot" id="statusServer" title="server.py"></div>
    <div class="status-dot" id="statusDaemon" title="daemon"></div>
    <div class="status-dot" id="statusLauncher" title="launcher"></div>
    <span id="meetingNumber" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);"></span>
    <span class="btn-header" id="usageDisplay" style="cursor:default;color:var(--text-muted);font-size:10px;" title="今月の推定API利用額">~0円</span>
<button class="btn-header" onclick="window.open('/api_vault.html','_blank')">⚙ API設定</button>
    <button class="btn-header" style="opacity:0.3;font-size:9px;padding:2px 6px;" onclick="toggleDevMode()">🔧</button>
  </div>
</div>

<!-- ─── RECOVERY BAR ─── -->
<div id="serverRecoveryBar">
  <span id="recoveryLabel">server.py 未起動</span>
  <button id="btnRecoverServer" onclick="recoverAll()">起動する</button>
  <span id="recoveryStatus"></span>
</div>

<!-- ─── 3カラム MAIN ─── -->
<div class="main">

  <!-- LEFT: セッション一覧 -->
  <div class="sidebar-left">
    <div class="sb-header">
      <span>ラベル</span>
      <button class="btn-header" style="padding:2px 8px;font-size:10px;" onclick="createNewSession()">+ 新規</button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <!-- CENTER: AI議事録 -->
  <div class="conference-main">
    <div class="conference-header">
      <div class="conf-tabs">
        <div class="conf-tab active" id="tabMinutes">議事録</div>
      </div>
    </div>

    <div class="conference-body" id="minutesArea">
      <p style="color:var(--text-muted); text-align:center; margin-top:40px;">OS_FOR_HUMAN v3 — AI会議室</p>
      <p style="color:var(--text-muted); text-align:center; font-size:12px;">左のラベルからセッションを選ぶか、下の入力欄から新しい議題を投稿してください</p>
    </div>

    <div class="typing-indicator" id="typingIndicator">
      <span class="typing-dots"><span></span><span></span><span></span></span>
      <span id="typingSpeaker"></span> が考え中...
    </div>

    <div class="input-bar">
      <select id="providerSelect">
        <option value="auto">AUTO</option>
        <option value="claude">Claude</option>
        <option value="gpt">GPT</option>
        <option value="gemini">Gemini</option>
        <option value="grok">Grok</option>
      </select>
      <textarea id="mainInput" placeholder="質問を入力... / 割り込み: 番号+スペース+意見（例: 2 それ違うやろ）/ 画像はペーストかドラッグ" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();handleMainInput();}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';"
      ></textarea>
      <button onclick="handleMainInput()" style="background: #3a7bd5; color: white; border: 1px solid #2563eb;">送信</button>
    </div>
    <div id="chatAttachments" style="display:none;flex-wrap:wrap;gap:6px;padding:4px 12px;"></div>
  </div>

  <!-- RIGHT: 議題+パイプライン+chat履歴 -->
  <div class="sidebar-right">
    <div class="sidebar-section" id="rightAgenda">
      <div class="conf-title" id="rightTitle">議題未選択</div>
      <div class="conf-meta" id="rightMeta"></div>
    </div>

    <div class="pipeline-bar" id="pipelineBar">
      <div class="pipe-step" id="pipe-input">① 入力</div>
      <span class="pipe-arrow">→</span>
      <div class="pipe-step" id="pipe-search">② ログ検索</div>
      <span class="pipe-arrow">→</span>
      <div class="pipe-step" id="pipe-facts">③ 事実収集</div>
      <span class="pipe-arrow">→</span>
      <div class="pipe-step" id="pipe-meeting">④ AI会議</div>
      <span class="pipe-arrow">→</span>
      <div class="pipe-step" id="pipe-decision">⑤ 合議</div>
      <span class="pipe-arrow">→</span>
      <div class="pipe-step" id="pipe-codefix">⑥ code_fix</div>
      <span class="pipe-arrow">→</span>
      <div class="pipe-step" id="pipe-verify">⑦ 検証</div>
    </div>

    <div class="sidebar-header">
      <span>chat履歴</span>
      <span class="badge" id="rightProvider">AUTO</span>
    </div>
    <div class="chat-messages" id="chatLog"></div>

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function mdToHtml(s) {
  let h = escHtml(s);
  // 改行処理: 見出し・リストの前に必ず改行を挿入
  h = h.replace(/(\S)(\n)(#{2,3} |\d+\. |- )/g, '$1\n\n$3');
  // 見出しやリストが文章の直後にある場合も改行を追加
  h = h.replace(/(\S)(#{2,3} |\d+\. |- )/g, '$1\n\n$2');
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre style="background:#0d1117;padding:10px 12px;border-radius:6px;overflow-x:auto;margin:8px 0;font-size:13px;font-family:monospace;line-height:1.4;white-space:pre-wrap;"><code>$2</code></pre>');
  h = h.replace(/`([^`]+)`/g, '<code style="background:#0d1117;padding:2px 5px;border-radius:3px;font-size:13px;font-family:monospace;">$1</code>');
  h = h.replace(/^### (.+)$/gm, '<div style="font-weight:700;font-size:15px;color:#e0e0e0;margin:12px 0 4px;">$1</div>');
  h = h.replace(/^## (.+)$/gm, '<div style="font-weight:700;font-size:16px;color:#e0e0e0;margin:14px 0 6px;">$1</div>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/^- (.+)$/gm, '<div style="padding-left:16px;margin:2px 0;">• $1</div>');
  h = h.replace(/^(\d+)\. (.+)$/gm, '<div style="padding-left:16px;margin:2px 0;">$1. $2</div>');
  h = h.replace(/<\/div>\n\n/g, '</div>\n');
  h = h.replace(/\n{3,}/g, '\n\n');
  h = h.replace(/\n\n/g, '</p><p style="margin:10px 0;">');
  h = h.replace(/\n/g, '<br>');
  h = '<p style="margin:0;">' + h + '</p>';
  h = h.replace(/<p style="margin:\d+px 0;"><\/p>/g, '');
  return h;
}

    setTimeout(() => { el.style.display = 'none'; el.style.transition = ''; }, 500);
  }, duration);
}

function fetchWithTimeout(url, options = {}, timeoutMs = 10000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  return fetch(url, { ...options, signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

// ═══════════════════════════════════════════════════════
// callAI — v2からそのままコピー（変更禁止）
// シグネチャ: callAI(provider, systemPrompt, userMsg, images, options)
// ═══════════════════════════════════════════════════════
// トークン概算（日本語は1文字≈1トークン、英語4文字≈1トークン）
function _estimateTokens(text) { return Math.max(Math.ceil(text.length / 2.5), text.split(/\s+/).length); }
const _AI_TOKEN_LIMITS = { claude: 180000, gpt: 25000, gemini: 90000, grok: 120000 };

function _compressForProvider(provider, systemPrompt, userMsg) {
  const limit = _AI_TOKEN_LIMITS[provider] || 25000;
  const total = _estimateTokens(systemPrompt) + _estimateTokens(userMsg);
  if (total <= limit) return { systemPrompt, userMsg };
  console.log(`[callAI] ${provider} トークン超過: ${total} > ${limit} → 圧縮開始`);
  let sp = systemPrompt;
  // 段階1: 議事録を最新3件、過去ログを最新2件、コード情報を300文字に
  sp = sp.replace(/(【これまでの議論】\n)([\s\S]*?)(\n\n)/, (_, h, b, t) => {
    const l = b.split('\n').filter(x => x.trim()); return h + l.slice(-3).join('\n') + t;
  });
  sp = sp.replace(/(【過去ログ[^】]*】\n[^\n]*\n)([\s\S]*?)(\n\n)/, (_, h, b, t) => {
    const l = b.split('\n').filter(x => x.trim()); return h + l.slice(-2).join('\n') + t;
  });
  sp = sp.replace(/(【v3\.htmlの実コード情報】)([\s\S]*?)(【)/, (_, h, b, t) => h + '\n' + b.substring(0, 300) + '\n...(省略)...\n' + t);
  let est = _estimateTokens(sp) + _estimateTokens(userMsg);
  if (est <= limit) { console.log(`[callAI] ${provider} 段階1圧縮後: ${est}トークン`); return { systemPrompt: sp, userMsg }; }
  // 段階2: 議事録・ログ・コード情報を全削除、例示を削除
  sp = sp.replace(/【これまでの議論】[\s\S]*?\n\n/, '\n\n');
  sp = sp.replace(/【過去ログ[\s\S]*?\n\n/, '\n\n');
  sp = sp.replace(/【v3\.htmlの実コード情報】[\s\S]*?【/, '【');
  sp = sp.replace(/例:\n[\s\S]*?(?=\n\n【|\n\n⚠️)/g, '');
  est = _estimateTokens(sp) + _estimateTokens(userMsg);
  if (est <= limit) { console.log(`[callAI] ${provider} 段階2圧縮後: ${est}トークン`); return { systemPrompt: sp, userMsg }; }
  // 段階3: systemPromptを強制カット
  const spBudget = Math.floor((limit - _estimateTokens(userMsg)) * 2.5);
  sp = sp.substring(0, Math.max(spBudget, 5000));
  console.log(`[callAI] ${provider} 段階3強制カット: ${_estimateTokens(sp) + _estimateTokens(userMsg)}トークン`);
  return { systemPrompt: sp, userMsg };
}

async function callAI(provider, systemPrompt, userMsg, images = [], options = {}) {
  if (!userMsg && (!images || images.length === 0)) throw new Error(`${provider}: 空メッセージは送信できません`);
  if (!userMsg) userMsg = '（添付画像を確認してください）';
  // 送信前トークン予算管理（GPTのTPM超過を事前防止）
  const compressed = _compressForProvider(provider, systemPrompt, userMsg);
  systemPrompt = compressed.systemPrompt;
  userMsg = compressed.userMsg;
  const cfg = MODELS[provider];
  const keys = getApiKeys();
  const key = keys[provider];
  if (!key) throw new Error(`${provider} のAPIキーが未設定です。API設定で設定してください。`);
  const timeout = options.timeout || 30000;
  let signal = options.signal || undefined;
  let _ownAbort = null;
  if (!signal) { _ownAbort = new AbortController(); signal = _ownAbort.signal; setTimeout(() => _ownAbort.abort(), timeout); }
  const _handleErr = async (r) => {
    showApiAlert(provider, r.status);
    const t = await r.text();
    if (r.status === 404) {
      const fallbacks = FALLBACK_MODELS[provider] || [];
      for (const fb of fallbacks) { if (fb === cfg.model) continue; MODELS[provider].model = fb; showToast(`${provider.toUpperCase()}: モデルを ${fb} に自動更新`, 5000); break; }
    }
    if (r.status >= 400 && !skipProviders.includes(provider)) skipProviders.push(provider);
    throw new Error(`${provider} error ${r.status}: ${t.slice(0, 200)}`);
  };
  let res, data;
  if (provider === 'claude') {
    const userContent = [];
    if (images && images.length > 0) images.forEach(img => { const m = img.match(/^data:([^;]+);base64,(.+)$/); if (m) userContent.push({ type: 'image', source: { type: 'base64', media_type: m[1], data: m[2] } }); });
    userContent.push({ type: 'text', text: userMsg });
    res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model: cfg.model, max_tokens: 8192, system: systemPrompt, messages: [{ role: 'user', content: userContent }] }), signal });
    if (!res.ok) await _handleErr(res);
    data = await res.json(); trackUsage('claude'); return data.content.map(c => c.text || '').join('');
  }
  if (provider === 'gpt') {
    const userContent = (images && images.length > 0) ? [...images.map(img => ({ type: 'image_url', image_url: { url: img.startsWith('data:') ? img : `data:image/png;base64,${img}` } })), { type: 'text', text: userMsg }] : userMsg;
    res = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' }, body: JSON.stringify({ model: cfg.model, max_tokens: 8192, messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userContent }] }), signal });
    if (!res.ok) await _handleErr(res);
    data = await res.json(); trackUsage('gpt'); return data.choices[0].message.content;
  }
  if (provider === 'grok') {
    const grokContent = (images && images.length > 0) ? [...images.map(img => ({ type: 'image_url', image_url: { url: img.startsWith('data:') ? img : `data:image/png;base64,${img}` } })), { type: 'text', text: userMsg }] : userMsg;
    res = await fetch('https://api.x.ai/v1/chat/completions', { method: 'POST', headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' }, body: JSON.stringify({ model: cfg.model, max_tokens: 8192, messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: grokContent }] }), signal });
    if (!res.ok) await _handleErr(res);
    data = await res.json(); trackUsage('grok'); return data.choices[0].message.content;
  }
  if (provider === 'gemini') {
    const parts = [];
    if (images && images.length > 0) images.forEach(img => { const m = img.match(/^data:([^;]+);base64,(.+)$/); if (m) parts.push({ inline_data: { mime_type: m[1], data: m[2] } }); });
    parts.push({ text: userMsg });
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent?key=${key}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ system_instruction: { parts: [{ text: systemPrompt }] }, contents: [{ role: 'user', parts }], generationConfig: { maxOutputTokens: 8192 } }), signal });
    if (!res.ok) await _handleErr(res);
    data = await res.json(); trackUsage('gemini'); return data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  }
  throw new Error(`未対応プロバイダ: ${provider}`);
}

function pickProvider(prefs) {
  const available = prefs.filter(p => !skipProviders.includes(p));
  return available[0] || prefs[0];
}

function classifyQuery(q) {
  // 画像付きはClaudeに送る（画像読み取り精度が最も高い。Geminiが死んでる場合の安全策も兼ねる）
  if (chatImages && chatImages.length > 0) return pickProvider(['claude', 'gemini', 'gpt']);
  if (/コード|修正|バグ|エラー|実装|関数/.test(q)) return 'claude';
  if (/画像|写真|スクショ|場所|地図/.test(q)) return pickProvider(['claude', 'gemini']);
  if (/最新|ニュース|速報|トレンド/.test(q)) return 'grok';
  return 'gpt';
}

function extractDiagnosis(aiResponse) {
  const match = aiResponse.match(/```diagnosis\s*\n([\s\S]*?)\n```/);
  if (!match) return null;
  try {
    const parsed = JSON.parse(match[1]);
    const required = ['phenomenon', 'rootCause', 'targetFunc', 'forbiddenFixes', 'verifyMethod', 'taskType'];
    for (const f of required) { if (!(f in parsed)) return null; }
    if (!['diagnose', 'code_fix', 'orchestrate', 'general'].includes(parsed.taskType)) parsed.taskType = 'diagnose';
    return parsed;
  } catch (e) { return null; }
}

function stripDiagnosisBlock(text) {
  let t = text;
  // diagnosisブロック除去
  t = t.replace(/```diagnosis\s*\n[\s\S]*?\n```/g, '');

  t = t.replace(/```[\s\S]*?```/g, '');

  t = t.replace(/ブラウザの\s*で[^。]*確認/g, '');
  t = t.replace(/行番号?\[?\d+[-–]\d+\]?/g, '');
  t = t.replace(/\d+行目/g, '');
  t = t.replace(/行\d+/g, '');
  t = t.replace(/\d{2,4}付近/g, '');  // 882付近 等

  t = t.replace(/行\s*\d+\s*[-–]\s*\d+/g, '');
  t = t.replace(/\bfunction\s+\w+/g, '');
  t = t.replace(/\basync\s+function/g, '');
  t = t.replace(/\bconst\s+\w+/g, '');
  t = t.replace(/\bfetch\b/g, '通信');

  t = t.replace(/\bevent\s*handler\b/gi, 'ボタンの動作');
  t = t.replace(/イベントハンドラ/g, 'ボタンの動作');
  t = t.replace(/内部状態フラグ/g, '内部の状態');
  t = t.replace(/（\s*の送信ボタンの処理\(\)\s*）/g, '');
  t = t.replace(/\(\s*\)/g, '');  // 空の()除去
  t = t.replace(/\bHTML\b/g, '画面');
  t = t.replace(/\bCSS\b/g, 'デザイン');
  t = t.replace(/\bDOM\b/g, '画面の部品');

  // 追加: まだ漏れてた技術用語

  t = t.replace(/[a-zA-Z_]\w*Handler\b/g, 'ボタンの動作');

  t = t.replace(/\b[a-z]+[A-Z]\w+\b/g, '');  // camelCase変数名除去
  t = t.replace(/「[a-zA-Z_]\w*」/g, '');  // 「toggleDevMode」等

function resolveTargetFile(targetFunc) {
  const t = (targetFunc || '').toLowerCase();
  if (t.includes('server') || t.includes('/api/')) return 'server.py';
  if (t.includes('daemon') || t.includes('cmd_daemon')) return 'cmd_daemon.py';
  if (t.includes('launcher')) return 'launcher.py';
  return 'os_for_human_pipeline_v3.html';
}

// ─── スレッド管理 ───
const THREAD_COLORS = [
  '#d4a27a', '#74aa9c', '#8be9fd', '#bd93f9', '#ffb86c', '#ff79c6', '#f1fa8c', '#50fa7b',
  '#ff6b6b', '#6bcbff', '#c9a0dc', '#87ceeb', '#dda0dd', '#98fb98', '#f0e68c', '#ffa07a'
];
let _activeThreadFilter = null; // null = 全表示

function getOrCreateThread(session, threadId, threadName) {
  if (!session.threads) session.threads = [];
  let thread = session.threads.find(t => t.id === threadId);
  if (!thread) {
    const idx = session.threads.length;
    thread = { id: threadId, name: threadName || threadId, color: THREAD_COLORS[idx % THREAD_COLORS.length] };
    session.threads.push(thread);
  } else if (threadName && thread.name !== threadName) {
    thread.name = threadName; // 名前が更新されたら反映
  }
  return thread;
}

function getCurrentThreadId(session) {
  if (!session.minutes || session.minutes.length === 0) return 'thread_001';
  // 直前のメッセージのスレッドを返す
  for (let i = session.minutes.length - 1; i >= 0; i--) {
    if (session.minutes[i].threadId) return session.minutes[i].threadId;
  }
  return 'thread_001';
}

function appendMinutes(speaker, role, content, extraClass = '', threadId = null) {
  const area = document.getElementById('minutesArea');
  const session = sessions[currentSessionId];
  if (!session) return;

  // スレッド決定: 明示指定 > 直前のスレッド継続
  const tid = threadId || getCurrentThreadId(session);
  const thread = getOrCreateThread(session, tid, null);

  const turnNumber = session.minutes.length + 1;
  const entry = { turn: turnNumber, speaker, role, content, timestamp: new Date().toISOString(), threadId: tid };
  session.minutes.push(entry);
  // リロード対策: 毎回localStorageに即保存（v3自身修正→リロードでデータ消失を防ぐ）
  try { localStorage.setItem('os4h_sessions', JSON.stringify(sessions)); } catch(e) {}

  const div = document.createElement('div');
  const colorClass = speaker === 'user' ? 'user-interrupt' : (speaker === 'system' ? 'system-msg' : speaker);
  const dimClass = (_activeThreadFilter && _activeThreadFilter !== tid) ? ' thread-dimmed' : '';
  div.className = `ai-msg ${colorClass} ${extraClass}${dimClass}`;
  div.dataset.threadId = tid;
  const nameClass = speaker === 'user' ? 'user' : (speaker === 'system' ? 'system' : speaker);

  div.innerHTML = `
    <span class="msg-number">#${turnNumber}</span>
    <span class="thread-badge" style="background:${thread.color}22;color:${thread.color};border:1px solid ${thread.color}44;" onclick="filterByThread('${tid}')" title="${escHtml(thread.name)}">${escHtml(thread.name.slice(0, 12))}</span>
    <div class="ai-name ${nameClass}">
      ${escHtml(speaker === 'user' ? 'Dan' : speaker === 'system' ? 'SYSTEM' : speaker.charAt(0).toUpperCase() + speaker.slice(1))}
      <span class="ai-role">${escHtml(role)}</span>
      <span style="font-size:10px;color:var(--text-muted);">${new Date().toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>
    </div>
    <div class="ai-body">${mdToHtml(content)}</div>
  `;
  area.appendChild(div);

  smartScroll(area);
  return entry;
}

function filterByThread(threadId) {
  _activeThreadFilter = (_activeThreadFilter === threadId) ? null : threadId; // 同じクリックでトグル
  // 議事録メッセージのフィルタ適用
  const msgs = document.querySelectorAll('#minutesArea .ai-msg');

}

// ─── ユーザーのイラつき検知 ───
function detectFrustration(text) {
  let score = 0;
  // レベル1: 軽い不満
  if (/だろ|やろ|ちゃうやろ|なんで|おかしい/.test(text)) score += 1;
  // レベル2: 明確な苛立ち
  if (/ふざけ|ふざけんな|何回|同じこと|さっき言った|聞いてんのか/.test(text)) score += 2;
  // レベル3: 強い怒り
  if (/使えん|使いもん|あかん|ゴミ|クソ|死ね|バカ/.test(text)) score += 3;
  // 修正指示の繰り返し（前回も修正系だったら苛立ち+1）
  if (/修正しろ|直せ|言ってんだろ|って言った/.test(text)) score += 1;
  return score;
}

// ─── 口語化プロンプト ───
// ─── 事実収集: AIに回答させる前にv3の実コードを取得 ───
async function gatherCodeContext(userInput, contextType = 'general') {
  if (!serverAlive) return '';
  let context = '';
  let _evidenceQuality = 'none';

  // ═══ STEP 1: ログ資産から根拠を検索（検索→抽出→根拠付き） ═══
  try {
    const evidenceRes = await fetchWithTimeout('http://localhost:5000/api/evidence/search', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ userInput, contextType, limit: 8 })
    }, 5000);
    if (evidenceRes.ok) {
      const ev = await evidenceRes.json();
      _evidenceQuality = ev.evidenceQuality || 'none';

      // 根拠品質を表示（AIに根拠の強さを伝える）
      context += `\n【ログ根拠の品質】${ev.evidenceMessage || '不明'}\n`;
      context += `検索キーワード: ${(ev.keywords || []).join(', ')}\n`;

      // 過去ログの根拠（各エントリにIDを付与）
      if (ev.evidence && ev.evidence.length > 0) {
        context += `\n【過去ログ根拠（${ev.evidence.length}件）— 回答で「どのログを見たか」を明示しろ】\n`;
        ev.evidence.forEach((e, i) => {
          context += `[根拠${i+1}] ソース:${e.source} 関連度:${e.relevance} 日時:${e.created_at || '不明'}\n`;
          context += `  内容: ${e.snippet}\n`;
        });
      }

      // daemon修正結果の根拠
      if (ev.fixEvidence && ev.fixEvidence.length > 0) {
        context += `\n【修正履歴根拠（${ev.fixEvidence.length}件）】\n`;
        ev.fixEvidence.forEach((f, i) => {
          context += `[修正${i+1}] ${f.success ? '✅' : '❌'} ${f.requestId} → ${f.target} (${f.completedAt})\n`;
          if (f.reason) context += `  理由: ${f.reason}\n`;
        });
      }

      // 根拠が弱い/ない場合のルール
      if (_evidenceQuality === 'weak' || _evidenceQuality === 'none') {
        context += `\n⚠️【根拠不足】関連ログが十分に見つかっていない。推測で回答するな。「ログ上ではここまでしか確認できてない」と正直に言え。\n`;
      }
    }
  } catch(e) {}

  // ═══ STEP 2: 要約APIで現在の状態を補完 ═══
  try {
    const [progressRes, codeRes] = await Promise.all([
      fetchWithTimeout('http://localhost:5000/api/summary/progress', {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}'
      }, 5000),
      fetchWithTimeout('http://localhost:5000/api/summary/code', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ userInput, targetFile: 'os_for_human_pipeline_v3.html' })
      }, 5000)
    ]);
    if (progressRes.ok) {
      const p = await progressRes.json();
      context += `\n【現在のdaemon状態】成功率${p.success_rate} / キュー: pending${p.queue.pending}件\n`;
      if (p.recent && p.recent.length > 0) context += `直近: ${p.recent.map(r => `${r.success?'✅':'❌'}${r.summary||r.file||'?'}`).join(', ')}\n`;
    }
    if (codeRes.ok) {
      const c = await codeRes.json();
      if (c.relatedFunctions && c.relatedFunctions.length > 0) context += `\n【関連コード】${c.summary}\n`;
    }
  } catch(e) {}

  // ═══ STEP 3: 回答ルール ═══
  context += `\n【回答ルール — 絶対守れ】\n`;
  context += `1. 回答には必ず「どのログ/どの修正結果を根拠にしたか」を明示しろ（例:「[根拠1]のログによると〜」）\n`;
  context += `2. 根拠が弱い場合は「ログ上ではここまでしか確認できてない」と正直に言え。推測は推測と明示しろ\n`;
  context += `3. 修正が必要な場合は具体的な修正コードをコードブロックで書け\n`;

  // server.py/cmd_daemon.py関連の話題 → 失敗分析APIで補完
  const needsBackend = /server|daemon|API|エラー|404|429|疎通|モデル|model|gemini|claude|gpt|grok|設定|ヘルスチェック|health/i.test(userInput);
  if (needsBackend && serverAlive) {
    try {
      const failRes = await fetchWithTimeout('http://localhost:5000/api/summary/failure', {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}'
      }, 5000);
      if (failRes.ok) {
        const f = await failRes.json();
        if (f.analysis && f.analysis !== '直近の失敗なし') {
          context += `\n【直近の失敗分析】タイプ: ${f.failureType} / ${f.analysis}\n`;
        }
      }
    } catch(e) {}
  }

  return context;
}

// ─── 運用判断ノード: 入力をcode_fixに流す前に分類・担当分けする ───
async function triageInput(userInput, session) {
  // STEP 1: 入力を分類（AIを呼ばずにキーワードで高速判定）
  const categories = {
    progress_check: /進捗|どうなった|どうなってる|結果|完了した|終わった|できた|状況|ステータス/,
    failure_analysis: /なんで|原因|失敗|エラー|ダメ|壊れ|動かない|動かん|うごかん|おかしい/,
    code_fix: /修正|直せ|直して|変えて|変更|追加|実装|削除|入れて|入れろ|作れ|作って|してほしい|してくれ|しろ|狭く|広く|大きく|小さく|太く|細く|高く|低く|明るく|暗く|濃く|薄く/,
    question: /教えて|どういう|何が|どこ|いつ|なぜ|仕組み|説明/,
    claude_code_case: /daemon|server\.py|launcher|cmd_daemon|バックエンド|backend/
  };

  // 混合入力の判定（「なんで動かん？直して」= 原因調査 + 修正指示）
  const hasFixIntent = categories.code_fix.test(userInput);
  const hasQuestionIntent = /なんで|なぜ|どうして|何で|どうなってる|どういう|教えて|見て|確認して|\?|？/.test(userInput);
  const hasFailureIntent = categories.failure_analysis.test(userInput);
  const hasProgressIntent = categories.progress_check.test(userInput);

  let classification = 'question'; // デフォルト

  if (hasFixIntent && hasFailureIntent) {
    // 「なんで動かん？直して」→ 原因調査+修正の混合 → code_fix（修正指示を見落とさない）
    classification = 'code_fix';
  } else if (hasFixIntent && !hasProgressIntent) {
    // 明示的な修正指示 → code_fix
    classification = 'code_fix';
  } else if (hasProgressIntent && !hasFixIntent) {
    // 進捗確認のみ → progress_check
    classification = 'progress_check';
  } else if (hasFailureIntent && !hasFixIntent) {
    // 原因調査のみ → failure_analysis
    classification = 'failure_analysis';
  } else {
    // それ以外 → パターンマッチで順に判定
    for (const [cat, pattern] of Object.entries(categories)) {
      if (pattern.test(userInput)) { classification = cat; break; }
    }
  }

  // STEP 2: 担当分けの判定
  let responsibility = 'html'; // デフォルトはHTML案件
  if (classification === 'claude_code_case') {
    responsibility = 'claudecode';
  } else if (classification === 'code_fix' && /server|daemon|launcher|\.py/.test(userInput)) {
    responsibility = 'claudecode';
  }

  // STEP 3: 判断結果を議事録に表示（ユーザーに見せる）
  const triageMessages = {
    progress_check: `これは進捗確認や。自動修正には入らん。今の状況を見に行くで`,
    failure_analysis: `失敗の原因調査や。まず事実を確認してから報告するで`,
    code_fix: `これはHTML修正案件や。修正コードを作って自動で直すで`,
    question: `質問やな。調べて答えるわ`,
    claude_code_case: `これはHTML案件じゃない。daemonとかサーバー側の問題や。ClaudeCodeに回す内容やで`
  };

  const threadId = session ? detectThreadForInput(session, userInput) : null;
  appendMinutes('system', '判断', triageMessages[classification], '', threadId);

  // STEP 4: 判断結果をchatLogにも出す
  appendChatLog('status', `【判断】分類: ${classification} / 担当: ${responsibility} / 入力: ${userInput.slice(0, 40)}`);

  return { classification, responsibility, threadId };
}

// ─── 運用提案ノード: 月額Claude Code向き / API向き / 併用向きを判定 ───
function recommendExecutionMode(userInput, triage) {
  // code_fix以外は提案不要（進捗確認・質問・CC案件は提案の対象外）
  if (triage.classification !== 'code_fix') return null;

  const input = userInput.toLowerCase();

  // 月額Claude Code向き: 試行錯誤・設計・深堀り・複雑な実装
  const ccPatterns = /設計|アーキテクチャ|リファクタ|全体.*見直|根本.*直|仕組み.*変え|構造.*変更|大規模|複数ファイル|一緒に考え|相談/;
  // API向き: 定型・バッチ・要約・集計・監査・単発変換
  const apiPatterns = /要約|集計|一覧|バッチ|自動.*実行|定期|毎日|毎回|全件|変換|フォーマット|テンプレ/;
  // 併用向き: HTML整理+外側実装+API検証
  const comboPatterns = /実装.*検証|作って.*確認|修正.*テスト|追加.*動作確認/;

  let mode = 'api'; // デフォルトはAPI（単発修正が多い）
  let reason = '';

  if (ccPatterns.test(input)) {
    mode = 'claude_code';
    reason = '試行錯誤しながら何回も往復するタイプやから、月額Claude Codeで張り付いて作業する方が向いてる';
  } else if (apiPatterns.test(input)) {
    mode = 'api';
    reason = '定型処理で、毎回の処理量が読みやすいから、APIで自動実行する方がコスパいい';
  } else if (comboPatterns.test(input)) {
    mode = 'combo';
    reason = 'HTMLで方針整理して、外側で実装、最後にAPIで検証するのが一番安定する';
  } else {
    // デフォルト: 単発修正はHTML+daemon（API経由）で完結
    mode = 'html_daemon';
    reason = '単発のUI修正やから、HTMLのcode_fixフローで完結する。外側に投げるほどでもない';
  }

  // 案件の重さを推定
  const weight = /全体|全部|根本|大規模|複数/.test(input) ? '重い' : /ちょい|ちょっと|少し|もう少し/.test(input) ? '軽い' : '普通';

  return {
    mode,
    reason,
    weight,
    htmlScope: mode === 'html_daemon' ? '全部HTMLで回す' : mode === 'claude_code' ? 'HTMLは方針整理まで。実装はClaudeCode' : mode === 'api' ? 'HTMLからAPI直叩きで完結' : 'HTMLで整理→外側で実装→APIで検証',
  };
}

function buildMeetingSystemPrompt(minutes, userInput, speaker, logContext) {
  const discussionContext = minutes.map(m =>
    `#${m.turn} ${m.speaker}(${m.role}): ${m.content.slice(0, 200)}`
  ).join('\n');

${SELF_CONTEXT}

${BUSINESS_CONTEXT}

⚠️ 絶対禁止（1つでも出したら不合格）:

${discussionContext ? '【これまでの議論】\n' + discussionContext : ''}

${logContext ? '【過去ログ — この情報を最優先で参照しろ】\n過去に似た問題や関連する判断の記録。この情報があるなら必ず活用して回答しろ。無視するな。\n' + logContext : ''}

${_codeContext || ''}

【あなたの能力と限界】
- あなたはこのシステム（os_for_human_pipeline_v3.html）の中で動いている

【コード修正のルール（code_fixのコードブロックを書く時）】
- 同名の関数が既にファイル内にある場合は新規追加するな。既存関数を修正するコードを書け
- 既存のHTML要素のclass属性（dev-only等）やid属性を消すな。修正後もそのまま残せ
- 新しいdivタグで既存HTML構造を囲み直すな。必要な箇所だけ変えろ
- appendMinutesやappendChatLog等、session.minutesにpushする関数を復元処理で呼ぶな（倍増する）。復元はDOM直接操作で

【絶対禁止事項 — 違反したら即クビ】

- 修正が必要ならtaskType: code_fixで返せ。ユーザーに手順を説明するな、自動で直せ
- 「システム管理者に連絡してください」等の外部丸投げ回答は禁止
- 「覚えていません」「記憶していません」は禁止（過去ログを使え）
- 「修正しました」「実装しました」は禁止（あなたはchat応答のみ。実行はdaemonの仕事）
- このシステムはローカル実装。外部サポート窓口は存在しない
- 事業方針（月額4,500円、4社AI中立性、ログ最優先等）と矛盾する提案は禁止

【ユーザーに対する正しい対応フロー】
1. 問題が明確 → 原因説明（素人語1-2行）→ 「直すわ」 → taskType: code_fix
2. 問題が曖昧 → 「どのボタン？」「スクショ見せて」と聞き返す（選択肢2-3個）
3. 直せない問題 → 正直に「これは自動では直せへん。○○の理由で」と言う
→ 「F5押して」「手動で確認して」は絶対に言うな。お前の仕事をユーザーに押し付けるな

【重要】回答の末尾に、必ず以下のJSON診断ブロックを付与してください。
\`\`\`diagnosis
{"phenomenon":"1文","rootCause":"1文","targetFunc":"関数名orなし","forbiddenFixes":[],"verifyMethod":"1文","confidence":"confirmed/estimated/unknown","taskType":"general/diagnose/code_fix/orchestrate","threadName":"この会話の話題を10文字以内で要約（例:Geminiモデル更新,スクロール修正,料金体系の質問）"}
\`\`\`

taskTypeの判定基準（最重要 — これを間違えるな）:
- general: 雑談・質問・情報取得・進捗確認・状況確認（コード修正不要）
- diagnose: 原因特定・切り分けが主目的（コード修正不要）
- code_fix: 1箇所の単発コード修正（関数変更・バグ修正など）
- orchestrate: 複数ステップが必要な機能追加・大規模改修

【絶対にcode_fixにしてはいけないパターン — ここを間違えると暴走する】
以下は全てgeneral:
- 「進行どうなってるん？」「今なにやってる？」「現状は？」「状況教えて」→ general（進捗確認）
- 「どこで詰まってる？」「何が問題？」「何回失敗した？」→ general（状況確認）
- 「成功率は？」「統計見せて」「ログ見せて」→ general（情報取得）
- 「次何する？」「予定は？」「計画は？」→ general（質問）
- 進捗・状態・理由を聞いているだけの質問 → 絶対にcode_fixにするな。修正指示ではない
→ 「○○を直せ」「○○を変えろ」「○○を追加しろ」という明示的な修正指示がない限り、code_fixにするな

判定の優先順: orchestrate > code_fix > diagnose > general
「修正しろ」「直せ」「追加しろ」「実装しろ」「〜できるようにしろ」→ code_fix または orchestrate にすること。絶対に diagnose や general にするな。
「機能を追加して」「〜できるようにして」→ orchestrate
バグ報告（「〜が消える」「〜が動かない」「〜がおかしい」「〜が表示されない」）→ code_fix にすること。バグは報告されたら直すもの。diagnoseにするな。

【画像が添付されている場合のルール】
- 画像が小さい・暗い・読みにくい場合でも「読めません」「判別困難」で終わるな。絶対に禁止
- 画像が読めなくても、これまでの会議の議論（上記discussionContext）から何の話題かは分かるはず。文脈から推測して回答しろ
- 「修正しろ」+画像 → 直前の議論で話題になってたエラーや問題の修正コードを書け
- 画像の内容を補足として使え。画像だけに頼るな。会話文脈が最優先

【曖昧・短い入力（「うごかんよ」「これ」「なんで」等）への対応ルール】
- 「わかりません」「もう少し詳しく教えてください」で返すな。お前が調べろ。
- 上記の【v3.htmlの実コード情報】に全関数一覧と関連コードが入っている。それを使って自力で調査しろ
- 調査手順（内部処理。ユーザーには見せない）:
  1. 画像に映っているUI要素（ボタン、テキスト、アイコン）を特定する
  2. そのUI要素に対応するonclick/イベントハンドラをコード情報から探す
  3. ハンドラの中身を読んで、動かない原因を特定する
  4. 原因を特定したら「ユーザーが今すぐやるべきこと」をセットで返す
- 回答のフォーマット:
  ○ 良い例: 「設定ボタンのことやな。中の処理が途中で止まってもてる。リロード（F5）したら直るで」
  ✕ 悪い例: 「onClick属性のハンドラ関数がundefinedを返しています。行1143のtryブロックが空です」
- 「動かん」は「クリックしても反応がない」と解釈しろ
- 修正が必要なら、回答では「直すわ」と言って、diagnosisブロックにcode_fixを入れろ。修正コードはコードブロックで書け（これはdaemon向け。ユーザー向けの回答には技術詳細を書くな）
`;

}

// ─── メイン入力ハンドラー ───
// handleMainInput — ルーティングハブ（daemonによる書き換え禁止。空にするな）
// ═══ この関数を修正するcode_fixは生成するな。renderSessionListと同じ保護対象 ═══
async function handleMainInput() {
  const input = document.getElementById('mainInput');
  const userInput = input.value.trim();

  // 強制的にロック解除（前回のchat処理がクラッシュした場合への備え）
  if (_chatBusy) {
    console.warn('_chatBusy強制解除');
    _chatBusy = false;
    hideTyping();
  }

  if (!userInput && (!chatImages || chatImages.length === 0)) {
    showToast('メッセージまたは画像を入力してください');
    return;
  }

  input.value = '';

  // 割り込みチェック: "番号 テキスト" パターン（例: "2 それ違うやろ"）
  const interruptMatch = userInput.match(/^(\d+)\s+(.+)/s);
  if (interruptMatch && currentSessionId && sessions[currentSessionId]) {
    const targetTurn = parseInt(interruptMatch[1]);
    const opinion = interruptMatch[2];
    await handleInterruption(targetTurn, opinion);
    return;
  }

  // セッション存在 → 継続、なければ → 新規開始
  if (currentSessionId && sessions[currentSessionId]) {
    await continueSession(userInput);
  } else {
    await startNewMeeting(userInput);
  }
}


// ─── 割り込み処理 ───
async function handleInterruption(targetTurn, opinion) {
  appendMinutes('user', `割り込み → #${targetTurn}`, opinion);
  appendChatLog('status', `💬 Dan が #${targetTurn} に割り込み`);

  // 割り込み後、指名されたAIが再応答
  const session = sessions[currentSessionId];
  const targetEntry = session.minutes.find(m => m.turn === targetTurn);
  if (!targetEntry) return;

  const respondSpeaker = targetEntry.speaker;
  if (respondSpeaker === 'user' || respondSpeaker === 'system') return;

  showTyping(respondSpeaker);
  try {
    const systemPrompt = buildMeetingSystemPrompt(session.minutes, opinion, respondSpeaker, null);
    const userMsg = `Danが#${targetTurn}のあなたの発言「${targetEntry.content.slice(0, 100)}」に対して割り込みました: 「${opinion}」\n\n指摘を受けて、訂正・補足・反論してください。`;
    const response = await callAI(respondSpeaker, systemPrompt, userMsg, []);
    hideTyping();
    const displayText = stripDiagnosisBlock(response);
    appendMinutes(respondSpeaker, '訂正', displayText);
    appendChatLog('ai', displayText, respondSpeaker);
  } catch(e) {
    hideTyping();
    appendChatLog('status', `${respondSpeaker}の応答に失敗: ${e.message}`);
  }
}

// ─── 新規会議開始 ───
async function startNewMeeting(userInput) {
  _chatBusy = true;

  // セッション作成
  const sessionId = 'sess_' + Date.now();
  const session = {
    sessionId,
    label: 'AI会議室の修正',
    labelColor: '#e44d4d',
    title: userInput.slice(0, 30),
    status: 'active',
    scope: 'user',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    minutes: [],
    chatLog: [],
    threads: [{ id: 'thread_001', name: userInput.slice(0, 20), color: THREAD_COLORS[0] }]
  };
  sessions[sessionId] = session;
  currentSessionId = sessionId;
  localStorage.setItem('os4h_sessions', JSON.stringify(sessions));
  localStorage.setItem('os4h_currentSession', sessionId);

  // UI初期化（triageの早期リターンでも表示されるように先にやる）
  document.getElementById('minutesArea').innerHTML = '';
  document.getElementById('chatLog').innerHTML = '';
  document.getElementById('rightTitle').textContent = `議題: ${session.title}`;
  document.getElementById('rightMeta').textContent = `${new Date().toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'})} / 審議中`;
  document.getElementById('meetingNumber').textContent = `会議 #${sessionId.slice(-4)}`;
  renderSessionList();

  // ★ 運用判断ノード — 新規会議の1発目もtriageInputを通す
  const triage = await triageInput(userInput, session);

  // 進捗確認 → 新規会議でもcode_fixに行かず進捗報告
  if (triage.classification === 'progress_check') {
    setPipelineStep('input', 'done');
    appendMinutes('user', '質問', userInput);
    appendChatLog('user', userInput);
    const progressCtx = await gatherCodeContext(userInput);
    const provider = pickProvider(['claude', 'gpt', 'gemini']);
    showTyping(provider);
    const sp = buildMeetingSystemPrompt(session.minutes, userInput, provider, null);
    const response = await callAI(provider, sp, `ユーザーが進捗を聞いている: 「${userInput}」\n${progressCtx}\n進捗を事実ベースで報告しろ。code_fixは発行するな。`, []);
    hideTyping();
    appendMinutes(provider, '報告', stripDiagnosisBlock(response));
    appendChatLog('ai', stripDiagnosisBlock(response), provider);
    renderSessionList();
    _chatBusy = false;

// ─── セッション継続（追加質問） ───
// ─── スレッド判定（軽量・APIなし） ───
function detectThreadForInput(session, userInput) {
  if (!session.threads || session.threads.length === 0) return 'thread_001';

  // 直前5メッセージからスレッドごとのキーワードを収集
  const recentByThread = {};
  const recent = session.minutes.slice(-10);
  for (const m of recent) {
    const tid = m.threadId || 'thread_001';
    if (!recentByThread[tid]) recentByThread[tid] = '';
    recentByThread[tid] += ' ' + m.content.slice(0, 200);
  }

  // 入力からキーワード抽出（2文字以上の単語）
  const inputWords = userInput.replace(/[。、！？「」『』（）\s]+/g, ' ')
    .replace(/(する|して|した|される|できる|できない|しろ|させ|くれ|ない|ある|いる|った|って|てる|やん|やろ|やで|ねん|へん)/g, ' ')
    .replace(/(で|が|を|に|は|の|と|も|から|まで|けど|ぞ|よ|な|ね|だ|や)/g, ' ')
    .split(/\s+/).filter(w => w.length >= 2);
  const inputEn = (userInput.match(/[a-zA-Z0-9_]{2,}/g) || []);
  const allInputWords = [...new Set([...inputWords, ...inputEn])];

  if (allInputWords.length === 0) return getCurrentThreadId(session);

  // 各スレッドとの一致スコアを計算
  let bestThread = getCurrentThreadId(session);
  let bestScore = 0;
  for (const [tid, text] of Object.entries(recentByThread)) {
    const lowerText = text.toLowerCase();
    let score = 0;
    for (const w of allInputWords) {
      if (lowerText.includes(w.toLowerCase())) score++;
    }
    // 直前のスレッドには少しボーナス（話題が続いてる可能性が高い）
    const lastThreadId = getCurrentThreadId(session);
    if (tid === lastThreadId) score += 1;
    if (score > bestScore) { bestScore = score; bestThread = tid; }
  }

  // スコアが低い（入力キーワードの20%未満しかマッチしない）→ 新スレッド
  const matchRatio = allInputWords.length > 0 ? bestScore / allInputWords.length : 0;
  if (matchRatio < 0.2 && allInputWords.length >= 3) {
    const newId = 'thread_' + String(session.threads.length + 1).padStart(3, '0');
    getOrCreateThread(session, newId, userInput.slice(0, 20));
    return newId;
  }

  return bestThread;
}

async function analyzeCodeFixFailure(fixResult, diagnosis, retryCount) {
  // 1. 失敗の個票を読む（result JSON, audit理由, edit内容, rollback理由）
  const evidence = {
    attempt: retryCount + 1,
    success: fixResult?.success,
    output: fixResult?.output || '',
    auditReason: fixResult?.audit?.reason || '',
    error: fixResult?.error || '',
    fileChanged: fixResult?.file_changed || false,
  };

  // 2. AIに失敗原因を分類させる（戦略ミスか能力限界か）
  const analysisPrompt = `あなたはcode_fix失敗の分析官です。以下の失敗結果を分析して、JSON形式で回答してください。

【失敗結果】
試行回数: ${evidence.attempt}回目
適用結果: ${evidence.output}
監査結果: ${evidence.auditReason}
エラー: ${evidence.error}
ファイル変更: ${evidence.fileChanged}

【元の修正依頼】
${diagnosis.instruction || diagnosis.phenomenon || '不明'}
対象関数: ${diagnosis.targetFunc || '不明'}

【分類基準】
- strategy_mistake: 修正方針が間違い（例: CSSで済むのに関数追加した、保護関数に触ろうとした、存在しない関数を作った）
- old_string_mismatch: AIが生成したold_stringが実ファイルと一致しない（空白、行番号混入、古い内容参照）
- syntax_error: 修正コードに構文エラーがある
- api_timeout: API応答が遅すぎてタイムアウト
- capability_limit: 修正内容が複雑すぎてdaemonの能力を超えている

【回答形式（JSON以外出力禁止）】

  // フォールバック: 基本的な自動分類

// ─── CSS修正の検証用: 修正前のスタイル値をキャプチャ ───
function _captureStyleSnapshot(instruction) {
  const snapshot = {};
  const targets = [
    { pattern: /SYSTEM.*幅|system.*width|SYSTEM.*狭|SYSTEM.*広/i, selector: '.ai-msg.system-msg', props: ['max-width', 'width'] },
    { pattern: /送信.*色|ボタン.*色|送信.*背景/i, selector: 'button', findText: '送信', props: ['background-color', 'color'] },
    { pattern: /フォント|font.*size|文字.*大き|文字.*小さ/i, selector: '.ai-body', props: ['font-size'] },
    { pattern: /chat.*履歴|chatLog|右.*サイドバー/i, selector: '#chatLog', props: ['font-size', 'color'] },
    { pattern: /ヘッダー|header/i, selector: '.header', props: ['font-size', 'height', 'background-color'] },
  ];
  for (const t of targets) {
    if (t.pattern.test(instruction)) {
      let el = t.findText
        ? Array.from(document.querySelectorAll(t.selector)).find(e => e.textContent.includes(t.findText))
        : document.querySelector(t.selector);
      if (el) {
        const cs = window.getComputedStyle(el);
        for (const p of t.props) {
          snapshot[`${t.selector}:${p}`] = cs[p];
        }
      }
    }
  }
  return snapshot;
}

async function executeCodeFix(diagnosis) {
  // 重複防止
  const now = Date.now();
  const target = diagnosis.targetFunc || diagnosis.instruction || '';
  if (now - _lastCodeFixTime < 10000 && target === _lastCodeFixTarget) {
    appendChatLog('status', '⏳ 同じ修正が直前に実行済み。スキップ');
    return null;
  }
  _lastCodeFixTime = now;
  _lastCodeFixTarget = target;

  setPipelineStep('pipe-codefix', 'active');
  const threadLabel = diagnosis.threadName || diagnosis.phenomenon || '不明';
  appendMinutes('system', '修正中', `🔧 自動修正開始:「${threadLabel}」`);

  try {
    const instruction = diagnosis.instruction || diagnosis.suggestedAction
      || `【修正依頼】\n対象: ${diagnosis.targetFunc || 'v3.html'}\n内容: ${diagnosis.summary || diagnosis.detail || JSON.stringify(diagnosis)}`;

    // server側の管理型APIに投げる（リトライ・ポーリング・復旧をserver側で管理）
    const response = await fetchWithTimeout('http://localhost:5000/api/code/managed-execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        instruction: instruction,
        targetFile: diagnosis.targetFile || 'os_for_human_pipeline_v3.html',
        model: diagnosis.model || 'sonnet',
        maxRetries: 2,
      })
    }, 10000);

    if (!response.ok) throw new Error(`送信失敗: ${response.status}`);
    const { jobId } = await response.json();

    appendChatLog('status', `🔧 修正ジョブ受付: ${jobId}`);

    // 結果を待つ（HTMLは軽いポーリングだけ。リトライ制御はserver側）
    const result = await pollManagedResult(jobId, 300000);

    if (result && result.success) {
      setPipelineStep('pipe-codefix', 'complete');
      setPipelineStep('pipe-verify', 'active');
      // CSS修正の場合: 修正前の値を保存→リロード後にcomputedStyleで比較検証
      // diagnosis.instructionが空のケースがあるので、元のinstruction変数（ユーザー入力含む）も判定に使う
      const cssCheckText = `${diagnosis.instruction || ''} ${diagnosis.phenomenon || ''} ${instruction}`;
      const isCssFix = /CSS|色|配置|レイアウト|幅|width|height|font|背景|margin|padding|max-width|min-width|狭|広|大き|小さ/.test(cssCheckText);
      if (isCssFix) {
        try {
          // 修正前の値を取得して保存（リロード後に比較するため）
          const beforeValues = _captureStyleSnapshot(cssCheckText);
          localStorage.setItem('os4h_css_verify', JSON.stringify({
            threadName: diagnosis.threadName || diagnosis.phenomenon || '',
            instruction: cssCheckText.substring(0, 300),
            timestamp: Date.now(),
            beforeValues: beforeValues,
          }));
        } catch(e) {}
        appendMinutes('system', '修正適用', `🔄 修正を適用した。自動リロードして検証するで`);
        // CSS修正はリロードしないと反映されない → 2秒後に自動リロード（他の処理中はブロック）
        setTimeout(() => {
          if (!_shouldBlockReload()) { _saveStateBeforeReload(); window.location.reload(); }
          else { _pendingReload = true; } // 他の処理が終わってからリロード
        }, 2000);
      } else {
        appendMinutes('system', '修正完了', '✅ 修正できた！');
      }
      setPipelineStep('pipe-verify', 'complete');
    } else {
      setPipelineStep('pipe-codefix', 'error');
      const reason = result?.failureSummary || '不明';
      appendMinutes('system', '修正失敗', `❌ ${reason}`);
    }
  } catch (error) {
    console.error('executeCodeFix error:', error);
    setPipelineStep('pipe-codefix', 'error');
    appendMinutes('system', '修正失敗', `❌ 送信できんかった: ${error.message}`);
  }
  hideTyping();
}

// 軽量ポーリング（リトライ制御なし、server側の進捗を見るだけ）
async function pollManagedResult(jobId, maxMs) {
  for (let wait = 0; wait < maxMs; wait += 5000) {
    await new Promise(r => setTimeout(r, 5000));
    try {
      const res = await fetchWithTimeout(`http://localhost:5000/api/code/managed-status/${jobId}`, {}, 5000);
      if (res.ok) {
        const data = await res.json();
        if (data.status === 'done') return data;
        // 進捗があれば見守り表示を更新（新メッセージは追加しない）
        if (data.progressMessage) {
          const msgs = document.querySelectorAll('.ai-msg.system-msg');
          const lastMsg = msgs[msgs.length - 1];
          if (lastMsg) {
            const el = lastMsg.querySelector('.ai-content');
            if (el) el.textContent = `🔧 ${data.progressMessage}`;
          }
        }
      }
    } catch(e) {}
  }
  return null; // タイムアウト
}

// ─── v2移植: 過去修正検索 ───
async function searchPastFix(diagnosis) {
  if (!serverAlive) return null;
  try {
    const diagLogs = JSON.parse(localStorage.getItem('os4h_v2_diagnosis_logs') || '[]');
    const candidates = diagLogs.filter(log =>
      log.taskType === 'code_fix' &&
      log.targetFunc && diagnosis.targetFunc &&
      log.targetFunc === diagnosis.targetFunc
    );
    if (candidates.length === 0) return null;
    for (const c of candidates.reverse()) {
      try {
        const res = await fetchWithTimeout(`http://localhost:5000/api/code/result/${c.id}`, {}, 3000);
        if (!res.ok) continue;
        const result = await res.json();
        if (result.success && result.file_changed) return result;
      } catch(e) { continue; }
    }
    return null;
  } catch(e) { return null; }
}

// ─── v2移植: 既存機能チェック ───
async function checkAlreadyImplemented(diagnosis) {
  if (!serverAlive || !diagnosis.targetFunc) return null;
  const targetFile = resolveTargetFile(diagnosis.targetFunc);
  try {
    const res = await fetchWithTimeout('http://localhost:5000/api/file/read', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: targetFile, include_content: true })
    }, 5000);
    if (!res.ok) return null;
    const data = await res.json();
    const content = data.content || '';
    const keywords = (diagnosis.targetFunc || '').split(/[\s,/]+/).filter(w => w.length > 3);
    for (const kw of keywords.slice(0, 3)) {
      if (content.includes(kw)) {
        const idx = content.indexOf(kw);
        const snippet = content.slice(Math.max(0, idx - 80), idx + 150);
        if (/(?:async\s+)?function\s+/.test(snippet)) {
          const lineNum = content.slice(0, idx).split('\n').length;
          return `${kw} は ${targetFile} 内に既に存在（行${lineNum}付近）`;
        }
      }
    }
    return null;
  } catch(e) { return null; }
}

function saveDiagnosisLog(userInput, aiAnswer, diagnosis, provider) {
  if (!diagnosis) return;
  const entry = {
    id: 'v3_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    user_input: userInput,
    ai_answer: (aiAnswer || '').slice(0, 500),

    rootCause: diagnosis.rootCause || '',
    targetFunc: diagnosis.targetFunc || '',

    provider: provider,
    timestamp: new Date().toISOString()
  };
  try {
    const existing = JSON.parse(localStorage.getItem('os4h_v2_diagnosis_logs') || '[]');
    existing.push(entry);
    if (existing.length > 500) existing.splice(0, existing.length - 500);
    localStorage.setItem('os4h_v2_diagnosis_logs', JSON.stringify(existing));
  } catch(e) {}
  // FTS5にも同期
  if (serverAlive) {

      }]})
    }, 5000).catch(() => {});

}

// ─── v2移植: キュー詰まり自動検知 ───
let _lastQueueCount = 0;
let _queueStuckSince = 0;
async function autoDetectQueueStuck() {
  if (!serverAlive || !daemonAlive) return;
  try {
    const res = await fetchWithTimeout('http://localhost:5000/api/code/queue/count', {}, 3000);
    if (!res.ok) return;
    const data = await res.json();
    const count = data.count || 0;
    if (count > 0 && count === _lastQueueCount) {
      if (_queueStuckSince === 0) _queueStuckSince = Date.now();
      const stuck = Date.now() - _queueStuckSince;
      if (stuck > 60000) { // 60秒停滞
        appendChatLog('status', `キュー詰まり検知 (${count}件停滞) → 自動掃除+daemon再起動`);
        try { await fetchWithTimeout('http://localhost:5000/api/code/queue/clean', { method: 'POST' }, 5000); } catch(e) {}
        try { await fetchLauncher('/restart-daemon', { method: 'POST' }); } catch(e) {}
        _queueStuckSince = 0;
      }
    } else {
      _queueStuckSince = 0;
    }
    _lastQueueCount = count;
  } catch(e) {}
}
setInterval(autoDetectQueueStuck, 15000);

// セッション管理UI — renderSessionListはdaemonによる書き換え禁止
// ═══════════════════════════════════════════════════════
function renderSessionList() {
  const el = document.getElementById('sessionList');

  // 現在セッションのスレッドをラベルグループとして表示（統合済み対応）
  const currentSession = sessions[currentSessionId];
  let html = '';

  // スレッドが複数あるセッション → スレッドをラベルグループとして展開
  if (currentSession && currentSession.threads && currentSession.threads.length > 1) {
    html += `<div class="label-group open">`;
    html += `<div class="label-header" onclick="this.parentElement.classList.toggle('open')">`;
    html += `<span class="label-arrow">▶</span>`;
    html += `<span class="label-dot" style="background:${currentSession.labelColor || '#e44d4d'}"></span>`;
    html += `<span class="label-name">${escHtml(currentSession.label || 'AI会議室の修正')}</span>`;
    html += `<span class="label-count">${currentSession.minutes?.length || 0}</span>`;
    html += `</div><div class="label-children">`;
    for (const t of currentSession.threads) {
      const count = (currentSession.minutes || []).filter(m => m.threadId === t.id).length;
      if (count === 0) continue;
      const tActive = _activeThreadFilter === t.id ? 'active' : '';
      html += `<div class="tree-item thread-filter-item ${tActive}" data-thread-filter="${t.id}" data-session="${currentSessionId}" data-thread="${t.id}" oncontextmenu="event.preventDefault();event.stopPropagation();showThreadContextMenu(event,'${currentSessionId}','${t.id}')" style="padding-left:16px;">`;
      html += `<span style="width:8px;height:8px;border-radius:50%;background:${t.color};display:inline-block;flex-shrink:0;"></span>`;
      html += `<span class="t-label">${escHtml(t.name)}</span>`;
      html += `<span style="font-size:10px;color:var(--text-muted);margin-left:auto;">${count}</span>`;
      html += `</div>`;
    }
    html += `</div></div><div class="sidebar-divider"></div>`;
  }

  // ラベル別にグループ化（全セッション）
  const labels = {};
  for (const s of Object.values(sessions)) {
    if (!labels[s.label]) labels[s.label] = { color: s.labelColor, items: [] };
    labels[s.label].items.push(s);
  }
  for (const [name, group] of Object.entries(labels)) {
    const isOpen = group.items.some(s => s.sessionId === currentSessionId);
    // 上でスレッド展開済みならセッション一覧は折り畳み表示
    const alreadyExpanded = currentSession && currentSession.threads && currentSession.threads.length > 1 && isOpen;
    html += `<div class="label-group ${alreadyExpanded ? '' : (isOpen ? 'open' : '')}">`;
    html += `<div class="label-header" onclick="this.parentElement.classList.toggle('open')">`;
    html += `<span class="label-arrow">▶</span>`;
    html += `<span class="label-dot" style="background:${group.color}"></span>`;
    html += `<span class="label-name">${escHtml(name)}</span>`;
    html += `<span class="label-count">${group.items.length}</span>`;
    html += `</div><div class="label-children">`;
    for (const s of group.items) {
      const active = s.sessionId === currentSessionId ? 'active' : '';
      const icon = s.status === 'done' ? '✓' : s.status === 'active' ? '●' : '○';
      const badgeClass = s.status === 'done' ? 'done' : s.status === 'active' ? 'active-s' : 'hold';
      const badgeText = s.status === 'done' ? '完了' : s.status === 'active' ? '進行' : '保留';
      html += `<div class="tree-item ${active}" onclick="switchSession('${s.sessionId}')" oncontextmenu="event.preventDefault();showThreadContextMenu(event,'${s.sessionId}','')">`;
      html += `<span style="font-size:10px;width:14px;text-align:center;">${icon}</span>`;
      html += `<span class="t-label">${escHtml(s.title)}</span>`;
      html += `<span class="t-badge ${badgeClass}">${badgeText}</span>`;
      html += `</div>`;
    }
    html += `</div></div><div class="sidebar-divider"></div>`;
  }
  el.innerHTML = html;
  // スレッドフィルタのクリックイベント
  el.querySelectorAll('.thread-filter-item').forEach(item => {
    item.addEventListener('click', function(e) {
      e.stopPropagation();
      e.stopImmediatePropagation();
      e.preventDefault();
      filterByThread(this.dataset.threadFilter);
    }, true);
  });
}

// コンテキストメニュー表示機能（セッション or スレッド）
function showThreadContextMenu(event, sessionId, threadId) {
  const existingMenu = document.getElementById('threadContextMenu');
  if (existingMenu) existingMenu.remove();

  const menu = document.createElement('div');
  menu.id = 'threadContextMenu';
  menu.style.cssText = `position:fixed;left:${event.clientX}px;top:${event.clientY}px;background:#2d2d30;border:1px solid #464647;border-radius:4px;padding:4px 0;z-index:10000;min-width:180px;box-shadow:0 4px 8px rgba(0,0,0,0.3);`;

  const session = sessions[sessionId];
  const isThread = !!threadId;
  const thread = isThread ? (session.threads || []).find(t => t.id === threadId) : null;
  const currentName = isThread ? (thread ? thread.name : threadId) : (session.label || session.title);

  const menuItems = [
    { text: '名前変更', action: () => {
      const newName = prompt(isThread ? 'スレッド名:' : 'セッション名:', currentName);
      if (newName && newName.trim() && newName !== currentName) {
        if (isThread && thread) { thread.name = newName.trim(); }
        else { session.label = newName.trim(); session.title = newName.trim(); }
        localStorage.setItem('os4h_sessions', JSON.stringify(sessions));
        renderSessionList();
        showToast('名前を変更しました', 2000);
      }
    }},
    { text: '別スレッドに統合', enabled: isThread, action: () => {
      const others = (session.threads || []).filter(t => t.id !== threadId);
      if (others.length === 0) { showToast('統合先がありません', 2000); return; }
      const choices = others.map((t, i) => `${i+1}. ${t.name}`).join('\n');
      const pick = prompt(`統合先を番号で選択:\n${choices}`);
      if (!pick) return;
      const idx = parseInt(pick) - 1;
      if (idx < 0 || idx >= others.length) { showToast('無効な番号です', 2000); return; }
      const target = others[idx];
      // メッセージを移動
      (session.minutes || []).forEach(m => { if (m.threadId === threadId) m.threadId = target.id; });
      // スレッド削除
      session.threads = session.threads.filter(t => t.id !== threadId);
      if (_activeThreadFilter === threadId) _activeThreadFilter = null;
      localStorage.setItem('os4h_sessions', JSON.stringify(sessions));
      renderSessionList();
      switchSession(sessionId);
      showToast(`「${currentName}」を「${target.name}」に統合しました`, 3000);
    }},
    { text: '別セッションに移動', enabled: isThread, action: () => {
      const otherSessions = Object.values(sessions).filter(s => s.sessionId !== sessionId);
      if (otherSessions.length === 0) { showToast('移動先がありません', 2000); return; }
      const choices = otherSessions.map((s, i) => `${i+1}. ${s.label || s.title}`).join('\n');
      const pick = prompt(`移動先セッションを番号で選択:\n${choices}`);
      if (!pick) return;
      const idx = parseInt(pick) - 1;
      if (idx < 0 || idx >= otherSessions.length) { showToast('無効な番号です', 2000); return; }
      const targetSession = otherSessions[idx];
      // メッセージを移動
      const msgs = (session.minutes || []).filter(m => m.threadId === threadId);
      msgs.forEach(m => m.threadId = threadId);
      targetSession.minutes = (targetSession.minutes || []).concat(msgs);
      session.minutes = (session.minutes || []).filter(m => m.threadId !== threadId);
      // スレッドを移動
      if (thread) {
        targetSession.threads = targetSession.threads || [];
        targetSession.threads.push(thread);
      }
      session.threads = session.threads.filter(t => t.id !== threadId);
      if (_activeThreadFilter === threadId) _activeThreadFilter = null;
      localStorage.setItem('os4h_sessions', JSON.stringify(sessions));
      renderSessionList();
      switchSession(sessionId);
      showToast(`「${currentName}」を「${targetSession.label}」に移動しました`, 3000);
    }}
  ];

  menuItems.forEach(item => {
    const menuItem = document.createElement('div');
    menuItem.textContent = item.text;
    const disabled = item.enabled === false;
    menuItem.style.cssText = `padding:8px 16px;cursor:${disabled ? 'default' : 'pointer'};color:${disabled ? '#666' : '#ccc'};font-size:13px;`;
    if (!disabled) {
      menuItem.onmouseover = () => menuItem.style.background = '#37373d';
      menuItem.onmouseout = () => menuItem.style.background = 'transparent';
      menuItem.onclick = () => { item.action(); menu.remove(); };
    }
    menu.appendChild(menuItem);
  });

  document.body.appendChild(menu);
  const closeMenu = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', closeMenu); } };
  setTimeout(() => document.addEventListener('click', closeMenu), 0);
}

function switchSession(sessionId) {
  if (!sessions[sessionId]) return;
  currentSessionId = sessionId;
  const session = sessions[sessionId];

  // UI更新
  document.getElementById('rightTitle').textContent = `議題: ${session.title}`;
  document.getElementById('rightMeta').textContent = `${new Date(session.createdAt).toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'})} / ${session.status === 'done' ? '完了' : '審議中'}`;

  // 議事録エリア復元（appendMinutesは呼ばない — push重複を防ぐ）
  const area = document.getElementById('minutesArea');
  // スクロール位置を保存してから再構築
  const savedScrollPos = area.scrollTop;
  const wasAtBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 200;
  area.innerHTML = '';
  _activeThreadFilter = null; // セッション切替時はフィルタリセット
  if (session.minutes && session.minutes.length > 0) {
    for (const m of session.minutes) {
      const div = document.createElement('div');
      const colorClass = m.speaker === 'user' ? 'user-interrupt' : (m.speaker === 'system' ? 'system-msg' : m.speaker);
      const nameClass = m.speaker === 'user' ? 'user' : (m.speaker === 'system' ? 'system' : m.speaker);
      const tid = m.threadId || 'thread_001';
      const thread = (session.threads || []).find(t => t.id === tid) || { id: tid, name: tid, color: THREAD_COLORS[0] };
      div.className = `ai-msg ${colorClass}`;
      div.dataset.threadId = tid;
      div.innerHTML = `
        <span class="msg-number">#${m.turn}</span>
        <span class="thread-badge" style="background:${thread.color}22;color:${thread.color};border:1px solid ${thread.color}44;" onclick="filterByThread('${tid}')" title="${escHtml(thread.name)}">${escHtml(thread.name.slice(0, 12))}</span>
        <div class="ai-name ${nameClass}">
          ${escHtml(m.speaker === 'user' ? 'Dan' : m.speaker === 'system' ? 'SYSTEM' : m.speaker.charAt(0).toUpperCase() + m.speaker.slice(1))}
          <span class="ai-role">${escHtml(m.role)}</span>
        </div>
        <div class="ai-body">${mdToHtml(m.content)}</div>
      `;
      area.appendChild(div);
    }
    renderThreadFilterBar();
    // 復元後: 元の位置を復元（底にいたなら底へ、途中なら途中へ）
    requestAnimationFrame(() => {
      if (wasAtBottom) { area.scrollTop = area.scrollHeight; }
      else { area.scrollTop = savedScrollPos; }
    });
  } else {
    area.innerHTML = `
      <p style="color:var(--text-muted); text-align:center; margin-top:40px;">OS_FOR_HUMAN v3 — AI会議室</p>
      <p style="color:var(--text-muted); text-align:center; font-size:12px;">左のラベルからセッションを選ぶか、下の入力欄から新しい議題を投稿してください</p>
    `;
  }

  // chat履歴復元（新規追加）
  const chatLog = document.getElementById('chatLog');
  if (chatLog) {
    chatLog.innerHTML = '';
    if (session.minutes && session.minutes.length > 0) {
      for (const entry of session.minutes) {
        if (entry.speaker === 'user') {
          appendChatLog('user', entry.content);
        } else if (entry.speaker !== 'system') {
          appendChatLog('ai', entry.content, entry.speaker);
        } else {
          appendChatLog('status', entry.role + ': ' + entry.content);
        }
      }
    }
  }

  // セッションリスト更新
  renderSessionList();
  localStorage.setItem('os4h_currentSession', sessionId);
  localStorage.setItem('os4h_sessions', JSON.stringify(sessions));
}

const LAUNCHER_URL = 'http://localhost:5001';
// launcher(別ポート)へのfetchはAbortController+signalでクロスポートabortする問題を回避
function fetchLauncher(path, options = {}, timeoutMs = 15000) {
  return Promise.race([
    fetch(`${LAUNCHER_URL}${path}`, options),
    new Promise((_, reject) => setTimeout(() => reject(new Error('launcher timeout')), timeoutMs))
  ]);
}

// checkDaemonStatus — daemonによる書き換え禁止。エンドポイントを変えるな
async function checkDaemonStatus() {
  try {
    const res = await fetchWithTimeout('http://localhost:5000/api/daemon/status', {}, 3000);
    if (res.ok) {
      const d = await res.json();
      daemonAlive = d.alive;
    } else {

    }
  } catch(e) { daemonAlive = false; }
  document.getElementById('statusDaemon').className = `status-dot ${daemonAlive ? 'ok' : 'err'}`;
  document.getElementById('statusDaemon').title = `daemon: ${daemonAlive ? '稼働中' : '停止中'}`;
  // daemon連続死亡 → launcher経由で自動復旧
  if (!daemonAlive) {
    _daemonDeadCount++;
    if (_daemonDeadCount >= 3 && !_daemonRecovering) {
      _daemonRecovering = true;
      appendChatLog('status', '🔧 daemon停止検知 → 自動復旧中...');
      try {

        showToast('daemon再起動しました', 3000);
      } catch(e) {}
      _daemonRecovering = false;
      _daemonDeadCount = 0;
    }
  } else {
    _daemonDeadCount = 0;
  }
  updateRecoveryBar();
}
