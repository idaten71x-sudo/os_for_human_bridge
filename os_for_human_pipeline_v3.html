// ─── セッション復元 ───
function restoreSessionsOnLoad() {
  try {
    const saved = localStorage.getItem('os4h_sessions');
    if (saved) {
      sessions = JSON.parse(saved);
      // マイグレーション1: 同一ラベルの分裂セッションを1つに統合 + 類似スレッドをグルーピング
      const labelGroups = {};
      for (const [sid, session] of Object.entries(sessions)) {
        const key = session.label || 'default';
        if (!labelGroups[key]) labelGroups[key] = [];
        labelGroups[key].push(sid);
      }
      for (const [label, sids] of Object.entries(labelGroups)) {
        if (sids.length <= 1) continue;
        sids.sort((a, b) => new Date(sessions[a].createdAt) - new Date(sessions[b].createdAt));
        const mainSid = sids[0];
        const mainSession = sessions[mainSid];
        if (!mainSession.threads) mainSession.threads = [];

        // 内容ベースでカテゴリ分類（メッセージ本文からキーワードマッチ）
        const categories = [
          { id: 'thread_api', name: 'API設定・変更', keywords: ['api設定', 'apiキー', 'api key', 'AI設定', '設定に変更', '金庫', '🔒'] },
          { id: 'thread_fix', name: 'バグ修正・code_fix', keywords: ['修正', '直せ', '直して', 'バグ', 'エラー', '消える', '消えるぞ', '動かない', 'fix', 'daemon', 'F5', 'リロード', 'code_fix', '壊れ', '実装済み'] },
          { id: 'thread_qa', name: '質問・雑談', keywords: ['って何', 'なん？', '教えて', 'SaaS', '料金', '割引', 'orchestrate', '何？', '4社', '月額', '事業', 'OS_FOR_HUMAN'] },
          { id: 'thread_image', name: '画像・識別', keywords: ['画像', 'スクショ', '写真', 'わかるか', 'モデル名', 'Gemini', '古い', '確認して返す'] },
        ];
        function classifyByContent(minutes) {
          // 全メッセージのcontentを結合してキーワードマッチ
          const allText = minutes.map(m => (m.content || '')).join(' ').toLowerCase();
          let bestCat = null, bestScore = 0;
          for (const cat of categories) {
            let score = 0;
            for (const kw of cat.keywords) { if (allText.includes(kw.toLowerCase())) score++; }
            if (score > bestScore) { bestScore = score; bestCat = cat; }
          }
          return bestCat || categories[2]; // デフォルトは質問・雑談
        }

        // まず全サブセッションのminutesをメインに集約
        for (let i = 1; i < sids.length; i++) {
          const sub = sessions[sids[i]];
          if (!sub.minutes || sub.minutes.length === 0) { delete sessions[sids[i]]; continue; }
          for (const m of sub.minutes) { mainSession.minutes.push(m); }
          delete sessions[sids[i]];
        }
        // 全メッセージを時系列ソート
        mainSession.minutes.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        // 連続するメッセージをチャンク分割（ユーザー入力で区切る）
        const chunks = [];
        let currentChunk = [];
        for (const m of mainSession.minutes) {
          if (m.speaker === 'user' && currentChunk.length > 0) {
            chunks.push(currentChunk);
            currentChunk = [];
          }
          currentChunk.push(m);
        }
        if (currentChunk.length > 0) chunks.push(currentChunk);

        // 各チャンクを分類してthreadIdを付与
        const usedCategories = new Set();
        for (const chunk of chunks) {
          const cat = classifyByContent(chunk);
          usedCategories.add(cat.id);
          for (const m of chunk) { m.threadId = cat.id; }
        }

        // 使われたカテゴリだけthreadsに登録
        mainSession.threads = [];
        for (const cat of categories) {
          if (usedCategories.has(cat.id)) {
            mainSession.threads.push({ id: cat.id, name: cat.name, color: THREAD_COLORS[mainSession.threads.length % THREAD_COLORS.length] });
          }
        }
        // 統合後のタイトルはラベル名にする（元のめちゃくちゃなタイトルを上書き）
        mainSession.title = label;
        // turn番号を振り直し（時系列順）
        mainSession.minutes.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        mainSession.minutes.forEach((m, idx) => { m.turn = idx + 1; });
      }

      // マイグレーション2: 全セッションのスレッド再分類（バージョン管理付き）
      const THREAD_MIGRATION_VER = 3;
      const currentMigVer = parseInt(localStorage.getItem('os4h_thread_migration_ver') || '0');
      if (currentMigVer < THREAD_MIGRATION_VER) {
        const cats = [
          { id: 'thread_api', name: 'API設定・変更', keywords: ['api設定', 'apiキー', 'api key', 'AI設定', '設定に変更', '金庫', '🔒'] },
          { id: 'thread_fix', name: 'バグ修正・code_fix', keywords: ['修正', '直せ', '直して', 'バグ', 'エラー', '消える', '消えるぞ', '動かない', 'fix', 'daemon', 'F5', 'リロード', 'code_fix', '壊れ', '実装済み'] },
          { id: 'thread_qa', name: '質問・雑談', keywords: ['って何', 'なん？', '教えて', 'SaaS', '料金', '割引', 'orchestrate', '何？', '4社', '月額', '事業', 'OS_FOR_HUMAN'] },
          { id: 'thread_image', name: '画像・識別', keywords: ['画像', 'スクショ', '写真', 'わかるか', 'モデル名', 'Gemini', '古い', '確認して返す'] },
        ];
        for (const [sid, session] of Object.entries(sessions)) {
          if (!session.minutes || session.minutes.length === 0) continue;
          // ユーザー入力で区切ってチャンク化
          const chunks = []; let chunk = [];
          for (const m of session.minutes) {
            if (m.speaker === 'user' && chunk.length > 0) { chunks.push(chunk); chunk = []; }
            chunk.push(m);
          }
          if (chunk.length > 0) chunks.push(chunk);
          // 各チャンクを内容ベースで分類
          const used = new Set();
          for (const c of chunks) {
            const allText = c.map(m => (m.content || '')).join(' ').toLowerCase();
            let best = null, bestScore = 0;
            for (const cat of cats) {
              let score = 0;
              for (const kw of cat.keywords) { if (allText.includes(kw.toLowerCase())) score++; }
              if (score > bestScore) { bestScore = score; best = cat; }
            }
            const catId = (best || cats[2]).id;
            used.add(catId);
            for (const m of c) { m.threadId = catId; }
          }
          // threads再構築
          session.threads = [];
          for (const cat of cats) {
            if (used.has(cat.id)) {
              session.threads.push({ id: cat.id, name: cat.name, color: THREAD_COLORS[session.threads.length % THREAD_COLORS.length] });
            }
          }
          // turn番号振り直し
          session.minutes.forEach((m, idx) => { m.turn = idx + 1; });
          // タイトルがラベルと違う場合はラベル名に統一
          if (session.label && session.title !== session.label) {
            session.title = session.label;
          }
        }
        localStorage.setItem('os4h_thread_migration_ver', String(THREAD_MIGRATION_VER));
      }
      // フォールバック: threads/threadIdが無い場合
      for (const [sid, session] of Object.entries(sessions)) {
        if (!session.threads || session.threads.length === 0) {
          session.threads = [{ id: 'thread_001', name: (session.title || sid).slice(0, 20), color: THREAD_COLORS[0] }];
        }
        if (session.minutes) {
          for (const m of session.minutes) {
            if (!m.threadId) m.threadId = 'thread_001';
          }
        }
      }
      localStorage.setItem('os4h_sessions', JSON.stringify(sessions));
      const savedCurrent = localStorage.getItem('os4h_currentSession');
      if (savedCurrent && sessions[savedCurrent]) {
        currentSessionId = savedCurrent;
      }
    }
    renderSessionList();
    if (currentSessionId) {
      switchSession(currentSessionId);
    }
  } catch(e) {}
}

// ─── セッションログをFTS5に同期（検索できるようにする） ───
let _lastSyncedMinutes = 0;
async function syncSessionLogsToFTS() {
  if (!serverAlive) return;
  const allMinutes = [];
  for (const [sid, session] of Object.entries(sessions)) {
    if (!session.minutes) continue;
    for (const m of session.minutes) {
      allMinutes.push({
        source: 'v3_session',
        topic: session.title || sid,
        role: m.speaker || 'system',
        content: m.content || '',
        created_at: m.time || session.createdAt || new Date().toISOString()
      });
    }
  }
  // 前回同期から増えてなければスキップ
  if (allMinutes.length <= _lastSyncedMinutes) return;
  const newEntries = allMinutes.slice(_lastSyncedMinutes);
  try {
    await fetchWithTimeout('http://localhost:5000/api/logs/append-batch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entries: newEntries })
    }, 5000);
    _lastSyncedMinutes = allMinutes.length;
  } catch(e) {}
}
// v2の診断ログもFTSに同期（初回のみ）
let _v2LogsSynced = false;
async function syncV2DiagLogsToFTS() {
  if (_v2LogsSynced || !serverAlive) return;
  _v2LogsSynced = true;
  try {
    const dlogs = JSON.parse(localStorage.getItem('os4h_v2_diagnosis_logs') || '[]');
    if (dlogs.length === 0) return;
    const entries = dlogs.map(d => ({
      source: 'v2_diagnosis',
      topic: d.phenomenon || '',
      role: 'system',
      content: `[診断] ${d.phenomenon || ''} | 原因: ${d.rootCause || ''} | 修正対象: ${d.targetFunc || ''} | taskType: ${d.taskType || ''}`,
      created_at: d.timestamp || d.createdAt || ''
    }));
    await fetchWithTimeout('http://localhost:5000/api/logs/append-batch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entries })
    }, 10000);
  } catch(e) { _v2LogsSynced = false; }
}
setInterval(syncSessionLogsToFTS, 30000); // 30秒ごとに同期

// ─── 画像添付（ペースト+ドラッグ&ドロップ） ───
function renderChatAttachments() {
  const el = document.getElementById('chatAttachments');
  if (!el) return;
  el.style.display = chatImages.length > 0 ? 'flex' : 'none';
  el.innerHTML = '';
  chatImages.forEach((dataUrl, i) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;display:inline-block;';
    const thumb = document.createElement('img');
    thumb.src = dataUrl;
    thumb.style.cssText = 'height:60px;border-radius:6px;border:1px solid #333;object-fit:cover;';
    const btn = document.createElement('button');
    btn.textContent = '\u2715';
    btn.style.cssText = 'position:absolute;top:1px;right:1px;background:#000a;border:none;color:#f55;cursor:pointer;border-radius:4px;font-size:10px;padding:1px 3px;';
    btn.onclick = () => { chatImages.splice(i, 1); renderChatAttachments(); };
    wrap.appendChild(thumb); wrap.appendChild(btn); el.appendChild(wrap);
  });
}
// 小さすぎる画像をAIが読めるサイズに拡大する（最低幅800px）
function ensureMinImageSize(dataUrl, minWidth = 800) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      if (img.width >= minWidth) { resolve(dataUrl); return; }
      const scale = minWidth / img.width;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
document.addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      const reader = new FileReader();
      reader.onload = async ev => {
        const resized = await ensureMinImageSize(ev.target.result);
        chatImages.push(resized);
        renderChatAttachments();
      };
      reader.readAsDataURL(file);
    }
  }
});
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', e => {
  e.preventDefault();
  for (const file of e.dataTransfer.files) {
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = async ev => {
        const resized = await ensureMinImageSize(ev.target.result);
        chatImages.push(resized);
        renderChatAttachments();
      };
      reader.readAsDataURL(file);
    }
  }
});

// DOMロード完了後にセッション復元 + ログ同期 + pending code_fix結果チェック
window.addEventListener('load', () => {
  restoreSessionsOnLoad();
  // リロード後: 入力欄テキスト+スクロール位置を復元
  _restoreStateAfterReload();
  setTimeout(() => { syncV2DiagLogsToFTS(); syncSessionLogsToFTS(); }, 5000);

  // リロード後: CSS修正の反映確認（修正前の値と比較して議事録に正直報告）
  setTimeout(() => {
    const cssVerify = localStorage.getItem('os4h_css_verify');
    if (!cssVerify) return;
    try {
      const info = JSON.parse(cssVerify);
      if (Date.now() - info.timestamp > 120000) { localStorage.removeItem('os4h_css_verify'); return; }
      const beforeValues = info.beforeValues || {};
      const afterValues = _captureStyleSnapshot(info.instruction || '');
      // before vs after 比較
      let changed = false;
      let changedProps = [];
      let unchangedProps = [];
      for (const key of Object.keys(beforeValues)) {
        const before = beforeValues[key];
        const after = afterValues[key];
        if (after && after !== before) {
          changed = true;
          changedProps.push(`${key}: ${before} → ${after}`);
        } else if (after === before) {
          unchangedProps.push(`${key}: ${before}（変化なし）`);
        }
      }
      // 議事録に正直に報告（嘘をつかない）
      if (changedProps.length > 0) {
        appendMinutes('system', '検証OK', `✅ 修正が反映されてる: ${changedProps.map(p => p.split(':')[0]).join(', ')}`);
        appendChatLog('status', `✅ CSS検証合格: ${changedProps.join(' / ')}`);
      } else if (unchangedProps.length > 0) {
        appendMinutes('system', '検証NG', `❌ 修正したけど見た目変わってへん。「${info.threadName}」の効果なし`);
        appendChatLog('status', `❌ CSS検証不合格: ${unchangedProps.join(' / ')}`);
      } else {
        appendMinutes('system', '検証不能', `⚠️ 検証対象が見つからんかった。手動で確認してくれ`);
        appendChatLog('status', `⚠️ CSS検証: 対象要素なし`);
      }
      localStorage.removeItem('os4h_css_verify');
    } catch(e) { localStorage.removeItem('os4h_css_verify'); }
  }, 2000);

  // リロード後: 前回のcode_fixが完了してるかチェック
  setTimeout(async () => {
    const pending = localStorage.getItem('os4h_pending_codefix');
    if (!pending) return;
    try {
      const { reqId, targetFile, startedAt } = JSON.parse(pending);
      if (Date.now() - startedAt > 300000) { localStorage.removeItem('os4h_pending_codefix'); return; } // 5分超えたら無視
      const res = await fetchWithTimeout(`http://localhost:5000/api/code/result/${reqId}`, {}, 5000);
      if (!res.ok) return;
      const data = await res.json();
      if (data.success !== undefined) {
        const status = data.success ? '修正成功' : '修正失敗';
        const reason = data.audit ? data.audit.reason || '' : '';
        appendChatLog('status', `リロード前のcode_fix (${reqId}) の結果: ${status}。${reason}`);
        appendChatLog('status', data.success ? `<span style="color:#50fa7b;">✅ ${status}</span>` : `<span style="color:#ff6b6b;">❌ ${status}: ${reason}</span>`);
        localStorage.removeItem('os4h_pending_codefix');
      }
    } catch(e) {}
  }, 3000);
});

// 「待機中（0秒経過）」で永遠に止まる問題を防止
